<script type="module">
import * as THREE from "https://unpkg.com/three@0.160.0/build/three.module.js";
import { OrbitControls } from "https://unpkg.com/three@0.160.0/examples/jsm/controls/OrbitControls.js";
import { mergeGeometries, mergeVertices } from "https://unpkg.com/three@0.160.0/examples/jsm/utils/BufferGeometryUtils.js";

/* ============================================================================
   0. Utilities — seeded randomness, value noise, geometry helpers
   ========================================================================== */
function mulberry32(seed) {
  return function () {
    seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const rand = mulberry32(0x5eaf00d);   // deterministic layout: the same reef every load
const rr = (a, b) => a + (b - a) * rand();
const pick = (arr) => arr[Math.floor(rand() * arr.length)];
const TAU = Math.PI * 2;
const clamp = THREE.MathUtils.clamp;
const lerp = THREE.MathUtils.lerp;
const smooth = (e0, e1, x) => { const t = clamp((x - e0) / (e1 - e0), 0, 1); return t * t * (3 - 2 * t); };
const damp = (a, b, lambda, dt) => lerp(a, b, 1 - Math.exp(-lambda * dt));
const easeInOut = (t) => 0.5 - 0.5 * Math.cos(Math.PI * clamp(t, 0, 1));
const V3 = (x, y, z) => new THREE.Vector3(x, y, z);
const col = (c) => new THREE.Color(c);
const UP = new THREE.Vector3(0, 1, 0);
const Z_AXIS = new THREE.Vector3(0, 0, 1);
const gauss2 = (dx, dz, sx, sz) => Math.exp(-((dx * dx) / (sx * sx) + (dz * dz) / (sz * sz)));

const PERM = new Uint8Array(512);
const GRAD = new Float32Array(256);
{
  const p = Array.from({ length: 256 }, (_, i) => i);
  for (let i = 255; i > 0; i--) { const j = Math.floor(rand() * (i + 1)); [p[i], p[j]] = [p[j], p[i]]; }
  for (let i = 0; i < 512; i++) PERM[i] = p[i & 255];
  for (let i = 0; i < 256; i++) GRAD[i] = rand() * 2 - 1;
}
/** 3D value noise in roughly [-1, 1]. */
function vnoise(x, y, z) {
  const xi = Math.floor(x), yi = Math.floor(y), zi = Math.floor(z);
  const xf = x - xi, yf = y - yi, zf = z - zi;
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf), w = zf * zf * (3 - 2 * zf);
  const X = xi & 255, Y = yi & 255, Z = zi & 255;
  const A = PERM[X] + Y, B = PERM[X + 1] + Y;
  const AA = PERM[A] + Z, AB = PERM[A + 1] + Z, BA = PERM[B] + Z, BB = PERM[B + 1] + Z;
  const g = (i) => GRAD[PERM[i]];
  return lerp(
    lerp(lerp(g(AA), g(BA), u), lerp(g(AB), g(BB), u), v),
    lerp(lerp(g(AA + 1), g(BA + 1), u), lerp(g(AB + 1), g(BB + 1), u), v), w);
}
function fbm(x, y, z, oct = 4) {
  let s = 0, a = 0.5, f = 1;
  for (let i = 0; i < oct; i++) { s += a * vnoise(x * f, y * f, z * f); f *= 2.03; a *= 0.5; }
  return s;
}
function setVertexColors(geo, fn) {
  const p = geo.attributes.position, arr = new Float32Array(p.count * 3);
  const c = new THREE.Color(), v = new THREE.Vector3();
  for (let i = 0; i < p.count; i++) {
    v.fromBufferAttribute(p, i); fn(v, c, i);
    arr[i * 3] = c.r; arr[i * 3 + 1] = c.g; arr[i * 3 + 2] = c.b;
  }
  geo.setAttribute('color', new THREE.BufferAttribute(arr, 3));
  return geo;
}
function displace(geo, fn) {
  const p = geo.attributes.position, v = new THREE.Vector3();
  for (let i = 0; i < p.count; i++) { v.fromBufferAttribute(p, i); fn(v, i); p.setXYZ(i, v.x, v.y, v.z); }
  p.needsUpdate = true;
  geo.computeVertexNormals();
  return geo;
}
/** Welds a primitive so noise displacement stays crack-free and normals are smooth. */
function welded(geo) {
  geo.deleteAttribute('normal'); geo.deleteAttribute('uv');
  return mergeVertices(geo);
}
/** Bakes the transforms of several meshes into one geometry (one draw call per material). */
function mergeMeshes(meshes, material) {
  const geos = meshes.map((m) => {
    m.updateMatrix();
    let g = m.geometry.index ? m.geometry.toNonIndexed() : m.geometry.clone();
    g.applyMatrix4(m.matrix);
    for (const name of Object.keys(g.attributes)) if (name !== 'position' && name !== 'normal' && name !== 'color') g.deleteAttribute(name);
    if (!g.attributes.normal) g.computeVertexNormals();
    return g;
  });
  return new THREE.Mesh(mergeGeometries(geos, false), material);
}
function shadows(obj, cast = true, receive = true) {
  obj.traverse((o) => { if (o.isMesh) { o.castShadow = cast; o.receiveShadow = receive; } });
  return obj;
}

/* ============================================================================
   Global constants (world units ≈ decimetres; tank centred on the origin)
   ========================================================================== */
const TANK_W = 7, TANK_H = 4.5, TANK_D = 3.5, GLASS_T = 0.06;
const HALF_X = TANK_W / 2, HALF_Z = TANK_D / 2;
const BOTTOM_Y = -TANK_H / 2, TOP_Y = TANK_H / 2;
const INNER_X = HALF_X - GLASS_T, INNER_Z = HALF_Z - GLASS_T;
const FLOOR_Y = BOTTOM_Y + GLASS_T;
const WATER_Y = 1.82;
const ROOM_FLOOR_Y = -4.55;
const PARAMS = new URLSearchParams(location.search);

/** Shared, animated uniforms used by many patched materials. */
const U = {
  uTime: { value: 0 },
  uCaustic: { value: 0.62 },
  uNight: { value: 0 },
  uPixelRatio: { value: 1 },
};

/** Collision proxies for fish steering: { c: Vector3, r: radius, tag }. */
const OBSTACLES = [];
/** Points of interest where fish like to linger: { p, look }. */
const POIS = [];

/* ============================================================================
   Shared shader chunks — sway (plants, tentacles) and procedural caustics
   ========================================================================== */
const VERT_DECL = /* glsl */`
uniform float uTime;
#ifdef USE_SWAY
  attribute float aPhase;
  uniform float uSwayAmp; uniform float uSwaySpeed; uniform float uSwayWave; uniform float uSwayPow; uniform vec2 uSwayLean;
#endif
#ifdef USE_TENTACLE
  attribute vec3 aTip; varying vec3 vTip; varying float vT;
  uniform vec4 uPush; uniform float uDroop;
#endif
#ifdef USE_CAUSTICS
  varying vec3 vCausticPos; varying vec3 vCausticN;
#endif
`;

const PROJECT_VERTEX = /* glsl */`
vec4 mvPosition = vec4( transformed, 1.0 );
#ifdef USE_INSTANCING
  mvPosition = instanceMatrix * mvPosition;
#endif
#ifdef USE_SWAY
{
  // geometry is authored 0..1 along +Y, so position.y is the normalised height
  float sT = clamp( position.y, 0.0, 1.0 );
  float sW = pow( sT, uSwayPow );
  #ifdef USE_INSTANCING
    float sH = length( instanceMatrix[1].xyz );
    vec2 sBase = instanceMatrix[3].xz;
  #else
    float sH = 1.0;
    vec2 sBase = vec2( 1.0, 0.0 );
  #endif
  float tt = uTime * uSwaySpeed;
  vec2 sw = vec2( sin( tt + aPhase + sT * uSwayWave ) + 0.35 * sin( tt * 2.3 + aPhase * 1.7 ),
                  cos( tt * 0.73 + aPhase * 1.3 + sT * uSwayWave * 0.7 ) );
  mvPosition.xz += ( sw * uSwayAmp + uSwayLean ) * sW * sH;
  #ifdef USE_TENTACLE
    vec2 outDir = normalize( sBase + vec2( 1e-4, 0.0 ) );
    mvPosition.xz += outDir * uDroop * sT * sT * sH;
    mvPosition.y -= uDroop * 0.6 * sT * sT * sH;
    vec3 pd = mvPosition.xyz - uPush.xyz;
    float pl = length( pd );
    float pk = ( 1.0 - smoothstep( 0.0, 0.42, pl ) ) * uPush.w * sT;
    mvPosition.xyz += ( pd / max( pl, 1e-3 ) ) * pk * 0.2;
  #endif
}
#endif
#ifdef USE_CAUSTICS
  vCausticPos = ( modelMatrix * mvPosition ).xyz;
  vCausticN = inverseTransformDirection( transformedNormal, viewMatrix );
#endif
mvPosition = modelViewMatrix * mvPosition;
gl_Position = projectionMatrix * mvPosition;
`;

const FRAG_DECL = /* glsl */`
#ifdef USE_CAUSTICS
  uniform float uTime; uniform float uCaustic;
  varying vec3 vCausticPos; varying vec3 vCausticN;
  // Tileable domain-warped caustic pattern; two layers at different scales avoid visible repetition.
  float aqCausticLayer( vec2 uv, float t ) {
    vec2 p = mod( uv * 6.2831853, 6.2831853 ) - 250.0;
    vec2 i = p;
    float c = 1.0;
    float inten = 0.005;
    for ( int n = 0; n < 4; n ++ ) {
      float tt = t * ( 1.0 - ( 3.5 / float( n + 1 ) ) );
      i = p + vec2( cos( tt - i.x ) + sin( tt + i.y ), sin( tt - i.y ) + cos( tt + i.x ) );
      c += 1.0 / length( vec2( p.x / ( sin( i.x + tt ) / inten ), p.y / ( cos( i.y + tt ) / inten ) ) );
    }
    c /= 4.0;
    c = 1.17 - pow( c, 1.4 );
    return pow( abs( c ), 8.0 );
  }
  vec3 aqCaustic( vec3 wp ) {
    float inside = ( 1.0 - smoothstep( 3.3, 3.45, abs( wp.x ) ) ) * ( 1.0 - smoothstep( 1.55, 1.69, abs( wp.z ) ) ) * ( 1.0 - smoothstep( 1.7, 1.82, wp.y ) );
    float lamp = 1.0 - smoothstep( 0.6, 4.0, length( wp.xz * vec2( 0.72, 1.25 ) ) );
    float depthFade = 0.7 + 0.3 * smoothstep( -2.3, 1.8, wp.y );
    float a = aqCausticLayer( wp.xz * 0.23 + vec2( 0.17, 0.63 ) + wp.y * 0.05, uTime * 0.21 + 23.0 );
    float b = aqCausticLayer( wp.xz * 0.31 + vec2( 0.52, 0.08 ) - wp.y * 0.04, uTime * 0.16 + 61.0 );
    return vec3( 0.62, 0.88, 1.0 ) * ( a * 0.62 + b * 0.48 ) * inside * ( 0.3 + 0.7 * lamp ) * depthFade;
  }
#endif
`;

const CAUSTIC_FRAGMENT = /* glsl */`
#ifdef USE_CAUSTICS
  outgoingLight += diffuseColor.rgb * aqCaustic( vCausticPos ) * smoothstep( -0.1, 0.8, normalize( vCausticN ).y ) * uCaustic;
#endif
`;

/**
 * Patches a built-in material with shared features. Each feature combination
 * gets its own program cache key so programs are never shared incorrectly.
 */
function patchMaterial(material, { sway = null, swayUniforms = null, caustics = false } = {}) {
  let su = swayUniforms;
  if (!su && sway) {
    su = {
      uSwayAmp: { value: sway.amp ?? 0.06 }, uSwaySpeed: { value: sway.speed ?? 1 },
      uSwayWave: { value: sway.wave ?? 1.6 }, uSwayPow: { value: sway.pow ?? 2 },
      uSwayLean: { value: sway.lean ?? new THREE.Vector2(0.02, 0.0) },
    };
  }
  material.userData.swayUniforms = su;
  const defs = (su ? '#define USE_SWAY\n' : '') + (caustics ? '#define USE_CAUSTICS\n' : '');
  material.onBeforeCompile = (shader) => {
    shader.uniforms.uTime = U.uTime;
    shader.uniforms.uCaustic = U.uCaustic;
    if (su) Object.assign(shader.uniforms, su);
    shader.vertexShader = defs + VERT_DECL + shader.vertexShader.replace('#include <project_vertex>', PROJECT_VERTEX);
    shader.fragmentShader = defs + FRAG_DECL + shader.fragmentShader.replace('#include <opaque_fragment>', CAUSTIC_FRAGMENT + '\n#include <opaque_fragment>');
  };
  material.customProgramCacheKey = () => 'aq|' + defs;
  return material;
}
/** Depth material for swaying shadow casters, sharing the colour material's sway uniforms. */
function swayDepthMaterial(colorMaterial) {
  return patchMaterial(new THREE.MeshDepthMaterial({ depthPacking: THREE.RGBADepthPacking }), { swayUniforms: colorMaterial.userData.swayUniforms });
}

/* ============================================================================
   1. Renderer and scene initialisation
   ========================================================================== */
let renderer, scene, camera, controls, clock;
let background, lights, tank, water, chest, anemone, duck, food, bubbles, ripples, particles, creatures;
const fishes = [];

function initRenderer() {
  renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.1;
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  U.uPixelRatio.value = renderer.getPixelRatio();
  document.getElementById('app').appendChild(renderer.domElement);

  scene = new THREE.Scene();
  clock = new THREE.Clock();
  scene.environment = createEnvironmentMap();
  background = createBackground();
  scene.add(background.mesh);
  createRoom();
}

/** Small procedural "studio" reflected by glass, water, metal and wet surfaces. */
function createEnvironmentMap() {
  const env = new THREE.Scene();
  const box = (w, h, d, color, x, y, z, side = THREE.FrontSide) => {
    const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), new THREE.MeshBasicMaterial({ color, side }));
    m.position.set(x, y, z); env.add(m); return m;
  };
  box(30, 16, 30, new THREE.Color(0x0a1520), 0, 3, 0, THREE.BackSide);
  box(7, 0.2, 1.0, new THREE.Color(5.5, 4.8, 3.9), 0, 6.5, 0);       // the aquarium lamp
  box(0.2, 5, 9, new THREE.Color(0.18, 0.55, 0.9), -12, 2, 1);        // cool side light
  box(6, 3, 0.2, new THREE.Color(1.0, 0.72, 0.45), 6, 3, 12);         // warm room glow
  box(18, 0.2, 18, new THREE.Color(0.02, 0.035, 0.05), 0, -4.5, 0);   // dark floor
  const pmrem = new THREE.PMREMGenerator(renderer);
  const tex = pmrem.fromScene(env, 0.035).texture;
  pmrem.dispose();
  env.traverse((o) => { if (o.isMesh) { o.geometry.dispose(); o.material.dispose(); } });
  return tex;
}

function createBackground() {
  const mat = new THREE.ShaderMaterial({
    side: THREE.BackSide, depthWrite: false, depthTest: false,
    uniforms: {
      uTop: { value: col('#08111f') }, uMid: { value: col('#102b42') }, uBot: { value: col('#02070d') },
      uHaloDir: { value: new THREE.Vector3(0, 0, -1) }, uNight: U.uNight,
    },
    vertexShader: /* glsl */`
      varying vec3 vDir;
      void main() {
        vec4 wp = modelMatrix * vec4( position, 1.0 );
        vDir = wp.xyz - cameraPosition;
        gl_Position = projectionMatrix * viewMatrix * wp;
      }`,
    fragmentShader: /* glsl */`
      uniform vec3 uTop; uniform vec3 uMid; uniform vec3 uBot; uniform vec3 uHaloDir; uniform float uNight;
      varying vec3 vDir;
      float hash( vec2 p ) { return fract( sin( dot( p, vec2( 12.9898, 78.233 ) ) ) * 43758.5453 ); }
      void main() {
        vec3 d = normalize( vDir );
        vec3 c = d.y > 0.0 ? mix( uMid, uTop, smoothstep( 0.0, 0.55, d.y ) ) : mix( uMid, uBot, smoothstep( 0.0, 0.3, -d.y ) );
        float h = max( dot( d, normalize( uHaloDir ) ), 0.0 );
        c += vec3( 0.07, 0.16, 0.22 ) * pow( h, 14.0 ) + vec3( 0.02, 0.05, 0.07 ) * pow( h, 3.0 );   // soft halo behind the tank
        c *= mix( 1.0, 0.5, uNight );
        c += ( hash( gl_FragCoord.xy ) - 0.5 ) / 255.0;   // dither against banding
        gl_FragColor = vec4( c, 1.0 );
        #include <colorspace_fragment>
      }`,
  });
  const mesh = new THREE.Mesh(new THREE.SphereGeometry(90, 48, 24), mat);
  mesh.renderOrder = -10;
  mesh.frustumCulled = false;
  return { mesh, mat };
}

/** Dark cabinet, fading studio floor and a faint light spill from the tank. */
function createRoom() {
  const cabTop = BOTTOM_Y - 0.08;
  const cabH = cabTop - ROOM_FLOOR_Y;
  const cab = new THREE.Mesh(new THREE.BoxGeometry(7.5, cabH, 4.0), new THREE.MeshStandardMaterial({ color: 0x0e1115, roughness: 0.5, metalness: 0.25 }));
  cab.position.y = cabTop - cabH / 2;
  cab.receiveShadow = true;
  scene.add(cab);
  const trim = new THREE.Mesh(new THREE.BoxGeometry(7.56, 0.05, 4.06), new THREE.MeshStandardMaterial({ color: 0x252b33, roughness: 0.3, metalness: 0.7 }));
  trim.position.y = cabTop - 0.025;
  scene.add(trim);
  const kick = new THREE.Mesh(new THREE.BoxGeometry(7.3, 0.12, 3.8), new THREE.MeshStandardMaterial({ color: 0x050607, roughness: 0.8 }));
  kick.position.y = ROOM_FLOOR_Y + 0.06;
  scene.add(kick);

  const floorMat = new THREE.MeshStandardMaterial({ color: 0x0a1118, roughness: 0.55, metalness: 0.25, transparent: true, depthWrite: false });
  floorMat.onBeforeCompile = (shader) => {
    shader.vertexShader = 'varying vec2 vFloorXY;\n' + shader.vertexShader.replace('#include <begin_vertex>', '#include <begin_vertex>\nvFloorXY = position.xy;');
    shader.fragmentShader = 'varying vec2 vFloorXY;\n' + shader.fragmentShader.replace('#include <opaque_fragment>',
      'diffuseColor.a *= 1.0 - smoothstep( 5.0, 17.0, length( vFloorXY ) );\n#include <opaque_fragment>');
  };
  floorMat.customProgramCacheKey = () => 'aq-floor';
  const floor = new THREE.Mesh(new THREE.CircleGeometry(20, 64), floorMat);
  floor.rotation.x = -Math.PI / 2;
  floor.position.y = ROOM_FLOOR_Y;
  floor.receiveShadow = true;
  floor.renderOrder = -5;
  scene.add(floor);

  const spill = new THREE.Mesh(new THREE.PlaneGeometry(16, 12), new THREE.ShaderMaterial({
    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
    uniforms: { uNight: U.uNight },
    vertexShader: 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }',
    fragmentShader: `uniform float uNight; varying vec2 vUv;
      void main(){ vec2 p = (vUv - 0.5) * vec2(1.6, 2.2); float d = length(p);
        float a = (1.0 - smoothstep(0.15, 0.9, d)) * 0.07 * mix(1.0, 0.6, uNight);
        gl_FragColor = vec4(vec3(0.25, 0.6, 0.75) * a, 1.0); }`,
  }));
  spill.rotation.x = -Math.PI / 2;
  spill.position.set(0, ROOM_FLOOR_Y + 0.01, 1.8);
  spill.renderOrder = -4;
  scene.add(spill);
}

/* ============================================================================
   2. Camera and controls
   ========================================================================== */
const CAM_HOME = new THREE.Vector3(9, 6, 10);
const TARGET_HOME = new THREE.Vector3(-0.15, -0.5, 0);
const camState = { lastInteraction: performance.now(), idle: 0, tween: null };

function initCamera() {
  camera = new THREE.PerspectiveCamera(32, window.innerWidth / window.innerHeight, 0.1, 250);
  camera.position.copy(CAM_HOME);
  controls = new OrbitControls(camera, renderer.domElement);
  controls.target.copy(TARGET_HOME);
  controls.enableDamping = true;
  controls.dampingFactor = 0.05;
  controls.minDistance = 6;
  controls.maxDistance = 18;
  controls.maxPolarAngle = Math.PI * 0.78;
  controls.minPolarAngle = 0.12;
  controls.rotateSpeed = 0.6;
  controls.zoomSpeed = 0.8;
  controls.panSpeed = 0.6;
  controls.autoRotate = false;
  controls.update();
  const touch = () => { camState.lastInteraction = performance.now(); camState.idle = 0; camState.tween = null; };
  controls.addEventListener('start', touch);
  renderer.domElement.addEventListener('wheel', touch, { passive: true });
  renderer.domElement.addEventListener('pointerdown', touch);
}

function updateCamera(rawDt) {
  const now = performance.now();
  if (camState.tween) {
    const tw = camState.tween;
    tw.t = Math.min(1, tw.t + rawDt / tw.dur);
    const k = easeInOut(tw.t);
    camera.position.lerpVectors(tw.fromPos, tw.toPos, k);
    controls.target.lerpVectors(tw.fromTarget, tw.toTarget, k);
    if (tw.t >= 1) camState.tween = null;
  }
  // Subtle idle drift after a few quiet seconds; any interaction stops it at once.
  const idleFor = (now - camState.lastInteraction) / 1000;
  camState.idle = idleFor > 7 && !camState.tween ? damp(camState.idle, 1, 0.35, rawDt) : 0;
  controls.autoRotate = camState.idle > 0.001;
  controls.autoRotateSpeed = 0.32 * camState.idle * (Math.sin(now * 0.00004) >= 0 ? 1 : -1);

  // Keep the camera above the studio floor and the target near the tank.
  const dist = camera.position.distanceTo(controls.target);
  const floorLimit = Math.acos(clamp(-(controls.target.y - ROOM_FLOOR_Y - 0.6) / dist, -1, 1));
  controls.maxPolarAngle = Math.min(Math.PI * 0.78, floorLimit);
  controls.update(rawDt);
  const t = controls.target;
  const cx = clamp(t.x, -3.0, 3.0), cy = clamp(t.y, -2.0, 1.6), cz = clamp(t.z, -2.0, 2.0);
  if (cx !== t.x || cy !== t.y || cz !== t.z) {
    camera.position.x += cx - t.x; camera.position.y += cy - t.y; camera.position.z += cz - t.z;
    t.set(cx, cy, cz);
  }
  background.mesh.position.copy(camera.position);
  background.mat.uniforms.uHaloDir.value.copy(TARGET_HOME).sub(camera.position).normalize();
}

function resetCamera() {
  camState.tween = { t: 0, dur: 1.6, fromPos: camera.position.clone(), toPos: CAM_HOME.clone(), fromTarget: controls.target.clone(), toTarget: TARGET_HOME.clone() };
  camState.lastInteraction = performance.now();
  camState.idle = 0;
}

function createTank() {

  // Bevel-like glass edges: thin cyan-green rods on the vertical corners so the silhouette reads clearly.

      [0.12, h, TANK_D + 0.1, -HALF_X + 0.03, y, 0], [0.12, h, TANK_D + 0.1, HALF_X - 0.03, y, 0],

/* ============================================================================
   5. Water volume, animated surface and waterline
   ========================================================================== */
function createWater() {
  const w = INNER_X * 2 - 0.01, d = INNER_Z * 2 - 0.01;
  const h = WATER_Y - FLOOR_Y;
  const volMat = new THREE.MeshStandardMaterial({ color: 0x3aa6c4, emissive: 0x06303f, transparent: true, opacity: 0.12, roughness: 0.15, metalness: 0, depthWrite: false });
  const hidden = new THREE.MeshBasicMaterial({ visible: false });
  // BoxGeometry groups: +x, -x, +y, -y, +z, -z. The top is replaced by the animated surface.
  const volume = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), [volMat, volMat, hidden, volMat, volMat, volMat]);
  volume.position.y = FLOOR_Y + h / 2;
  volume.name = 'waterVolume';
  volume.renderOrder = 1;
  scene.add(volume);

  const SX = 120, SZ = 60;
  const geo = new THREE.PlaneGeometry(w, d, SX, SZ);
  geo.rotateX(-Math.PI / 2);
  const base = geo.attributes.position.array.slice();
  const surfMat = new THREE.MeshPhysicalMaterial({
    color: 0x7fd8f0, transparent: true, opacity: 0.34, roughness: 0.05, metalness: 0, clearcoat: 1, clearcoatRoughness: 0.04,
    side: THREE.DoubleSide, depthWrite: false, envMapIntensity: 1.7, ior: 1.33, specularIntensity: 1,
  });
  const surface = new THREE.Mesh(geo, surfMat);
  surface.position.y = WATER_Y;
  surface.name = 'waterSurface';
  surface.renderOrder = 3;
  scene.add(surface);

  // Faint bright meniscus line where water meets the glass.
  const wlMat = new THREE.MeshBasicMaterial({ color: 0xc8f6ff, transparent: true, opacity: 0.42, blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide });
  const wlSoft = new THREE.MeshBasicMaterial({ color: 0x5fc6e0, transparent: true, opacity: 0.12, blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide });
  const waterline = new THREE.Group();
  for (const [len, x, z, ry] of [[w, 0, INNER_Z - 0.004, 0], [w, 0, -INNER_Z + 0.004, 0], [d, -INNER_X + 0.004, 0, Math.PI / 2], [d, INNER_X - 0.004, 0, Math.PI / 2]]) {
    const line = new THREE.Mesh(new THREE.PlaneGeometry(len, 0.022), wlMat);
    line.position.set(x, 0, z); line.rotation.y = ry;
    const soft = new THREE.Mesh(new THREE.PlaneGeometry(len, 0.14), wlSoft);
    soft.position.set(x, -0.06, z); soft.rotation.y = ry;
    waterline.add(line, soft);
  }
  waterline.position.y = WATER_Y;
  waterline.renderOrder = 4;
  scene.add(waterline);

  const ripplesList = [];   // { x, z, t0, amp }
  let agitation = 0;
  function height(x, z, t) {
    let y = 0.016 * Math.sin(x * 1.7 + t * 0.9) + 0.011 * Math.sin(z * 2.3 - t * 1.3 + x * 0.4)
      + 0.006 * Math.sin((x + z) * 4.1 + t * 2.1) + 0.0035 * Math.sin((x * 0.7 - z) * 6.3 - t * 2.7);
    y *= 1 + agitation * 1.5;
    for (const r of ripplesList) {
      const age = t - r.t0;
      const dx = x - r.x, dz = z - r.z;
      const dist = Math.sqrt(dx * dx + dz * dz);
      const front = age * 1.25;
      const env = Math.exp(-age * 0.85) * Math.exp(-((dist - front) ** 2) / 0.09);
      y += r.amp * env * Math.sin(dist * 15 - age * 11);
    }
    return y;
  }
  function update(t, dt) {
    agitation = damp(agitation, 0, 0.6, dt);
    for (let i = ripplesList.length - 1; i >= 0; i--) if (t - ripplesList[i].t0 > 5) ripplesList.splice(i, 1);
    const p = geo.attributes.position.array;
    for (let i = 0; i < p.length; i += 3) p[i + 1] = height(base[i], base[i + 2], t);
    geo.attributes.position.needsUpdate = true;
    geo.computeVertexNormals();
    waterline.position.y = WATER_Y + height(0, INNER_Z, t) * 0.6;
  }
  function addRipple(x, z, amp = 0.03, agitate = 0.5) {
    ripplesList.push({ x, z, t0: U.uTime.value, amp });
    if (ripplesList.length > 8) ripplesList.shift();
    agitation = Math.min(1, agitation + agitate);
  }
  update(0, 0);
  geo.computeBoundingSphere();
  return { volume, volMat, surface, surfMat, waterline, update, addRipple, height };
}

/* ============================================================================
   6. Terrain and substrate
   ========================================================================== */
const RUIN = { x: -2.5, z: -1.05, y: -1.06 };

/** Height of the sand surface. Mounds at the back, a shallow central valley and an open front. */
function terrainHeight(x, z) {
  let h = -1.80;
  h += 0.64 * gauss2(x + 2.55, z + 1.1, 1.1, 0.85);    // back-left mound (temple ruins)
  h += 0.32 * gauss2(x - 2.8, z + 1.2, 0.95, 0.7);     // back-right rise (tall grass)
  h += 0.24 * gauss2(x - 0.35, z + 1.3, 1.5, 0.55);    // behind the rock cave
  h += 0.16 * smooth(0.6, -1.7, z);                    // gentle slope toward the back glass
  h -= 0.11 * gauss2(x - 0.3, z - 0.2, 0.7, 1.9);      // shallow valley through the centre
  h += 0.10 * gauss2(x + 0.85, z + 0.05, 0.75, 0.65);  // sand heaped around the anemone rock
  h += 0.08 * gauss2(x - 1.95, z + 0.35, 1.1, 0.5);    // sand banked under the driftwood
  h += 0.06 * gauss2(x + 2.35, z - 1.0, 0.8, 0.5);     // small dune by the bottle
  h += 0.03 * fbm(x * 0.9 + 3.1, 0.37, z * 0.9 - 1.7, 3);
  // flat terrace for the ruins so the slabs rest naturally
  const pr = Math.sqrt(((x - RUIN.x) / 1.0) ** 2 + ((z - RUIN.z) / 0.62) ** 2);
  h = lerp(h, RUIN.y + 0.015 * vnoise(x * 4, 2.2, z * 4), smooth(1.4, 0.9, pr));
  // ripples across the open front sand
  const ripple = smooth(0.15, 0.85, z) * (1 - smooth(2.4, 3.2, Math.abs(x)));
  h += 0.011 * Math.sin((x + 0.22 * Math.sin(z * 2.3) + 0.1 * z) * 11.5) * ripple;
  return h;
}

function makeGrainTexture() {
  const size = 128, data = new Uint8Array(size * size * 4), raw = new Float32Array(size * size);
  for (let i = 0; i < raw.length; i++) raw[i] = rand();
  for (let y = 0; y < size; y++) for (let x = 0; x < size; x++) {
    let s = 0;
    for (let oy = -1; oy <= 1; oy++) for (let ox = -1; ox <= 1; ox++) s += raw[((y + oy + size) % size) * size + ((x + ox + size) % size)];
    const v = Math.round(clamp((s / 9 - 0.5) * 3 + 0.5, 0, 1) * 255);   // blurred white noise = tileable grain
    const i = (y * size + x) * 4;
    data[i] = data[i + 1] = data[i + 2] = v; data[i + 3] = 255;
  }
  const tex = new THREE.DataTexture(data, size, size, THREE.RGBAFormat);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.repeat.set(7, 3.5);
  tex.minFilter = THREE.LinearMipmapLinearFilter;
  tex.generateMipmaps = true;
  tex.needsUpdate = true;
  return tex;
}

function createTerrain() {
  const geo = new THREE.PlaneGeometry(INNER_X * 2, INNER_Z * 2, 150, 76);
  geo.rotateX(-Math.PI / 2);
  const p = geo.attributes.position;
  for (let i = 0; i < p.count; i++) p.setY(i, terrainHeight(p.getX(i), p.getZ(i)));
  geo.computeVertexNormals();
  const sand = col('#c9ad7c'), sandDark = col('#a88a5e'), sandPale = col('#dcc59a'), wet = col('#8f7752'), algae = col('#7f8a58');
  setVertexColors(geo, (v, c) => {
    const n1 = fbm(v.x * 1.6 + 7, 0.3, v.z * 1.6 - 2, 3);
    const n2 = vnoise(v.x * 13, 1.7, v.z * 13);
    c.copy(sand).lerp(sandPale, smooth(0.05, 0.45, n1) * 0.6).lerp(sandDark, smooth(-0.05, -0.45, n1) * 0.7);
    c.lerp(wet, smooth(-1.84, -1.96, v.y) * 0.35);
    c.lerp(algae, smooth(0.25, 0.7, vnoise(v.x * 3 + 11, 0, v.z * 3)) * smooth(-1.45, -1.05, v.y) * 0.4);
    c.multiplyScalar(0.94 + n2 * 0.08);
  });
  const mat = patchMaterial(new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.97, metalness: 0, bumpMap: makeGrainTexture(), bumpScale: 1.6 }), { caustics: true });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.receiveShadow = true;
  mesh.name = 'sand';
  scene.add(mesh);
  createSubstrateSkirts();
}

/** Vertical walls of substrate visible through the glass: soil, pebble band, sand. */
function createSubstrateSkirts() {
  const soil = col('#33251e'), soilDark = col('#21170f'), sand = col('#c9ad7c'), sandDark = col('#a8895c');
  const pebbles = ['#a68b68', '#77736c', '#47423c', '#8c7a62'].map(col);
  const FIXED = [0, 0.04, 0.08, 0.11, 0.128, 0.142, 0.16, 0.18, 0.2, 0.218, 0.232, 0.25];
  const TOP_ROWS = 6;
  const mat = new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.95, side: THREE.DoubleSide });
  const sides = [
    { f: (t) => [lerp(-INNER_X, INNER_X, t), INNER_Z - 0.001], n: 200 },
    { f: (t) => [lerp(-INNER_X, INNER_X, t), -INNER_Z + 0.001], n: 200 },
    { f: (t) => [-INNER_X + 0.001, lerp(-INNER_Z, INNER_Z, t)], n: 100 },
    { f: (t) => [INNER_X - 0.001, lerp(-INNER_Z, INNER_Z, t)], n: 100 },
  ];
  for (const side of sides) {
    const rows = FIXED.length + TOP_ROWS;
    const pos = [], colors = [], idx = [];
    const c = new THREE.Color();
    for (let i = 0; i <= side.n; i++) {
      const [x, z] = side.f(i / side.n);
      const top = terrainHeight(x, z) - FLOOR_Y;
      const b1 = 0.128 + 0.014 * vnoise(x * 9, 0.5, z * 9);
      const b2 = 0.232 + 0.016 * vnoise(x * 7, 3.1, z * 7);
      const last = Math.min(FIXED[FIXED.length - 1], top - 0.02);
      for (let k = 0; k < rows; k++) {
        const yb = k < FIXED.length ? Math.min(FIXED[k], top - 0.02 * (FIXED.length - k) / FIXED.length) : lerp(last, top, (k - FIXED.length + 1) / TOP_ROWS);
        pos.push(x, FLOOR_Y + yb, z);
        if (yb < b1) c.copy(soil).lerp(soilDark, 0.5 + 0.5 * vnoise(x * 20, yb * 30, z * 20));
        else if (yb < b2) c.copy(pebbles[Math.floor((vnoise(x * 46, yb * 70, z * 46) * 0.5 + 0.5) * 3.99)]).multiplyScalar(0.8 + 0.3 * vnoise(x * 80, yb * 90, z * 80));
        else c.copy(sand).lerp(sandDark, 0.4 + 0.4 * vnoise(x * 30, yb * 25, z * 30));
        colors.push(c.r, c.g, c.b);
      }
    }
    for (let i = 0; i < side.n; i++) for (let k = 0; k < rows - 1; k++) {
      const a = i * rows + k, b = a + rows;
      idx.push(a, b, a + 1, b, b + 1, a + 1);
    }
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
    g.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
    g.setIndex(idx);

}

/** Hundreds of instanced gravel pieces on the sand plus a pebble band pressed against the glass. */
function createGravel() {
  const items = [];
  const clusters = [[-2.5, -0.75, 1.0], [0.35, -0.7, 0.9], [-0.85, 0.35, 0.7], [1.9, 0.0, 1.0], [2.85, 0.95, 0.6], [-2.6, 0.75, 0.7], [-1.6, -0.25, 0.6], [1.35, 1.05, 0.35]];
  let tries = 0;
  while (items.length < 1050 && tries++ < 30000) {
    const x = rr(-INNER_X + 0.04, INNER_X - 0.04), z = rr(-INNER_Z + 0.04, INNER_Z - 0.04);
    let dens = 0.2;
    for (const [cx, cz, r] of clusters) dens = Math.max(dens, 0.95 * Math.exp(-((x - cx) ** 2 + (z - cz) ** 2) / (r * r)));
    dens = Math.max(dens, 0.8 * Math.max(smooth(INNER_X - 0.5, INNER_X, Math.abs(x)), smooth(INNER_Z - 0.4, INNER_Z, Math.abs(z))));
    if (z > 0.45 && Math.abs(x) < 2.0) dens *= 0.35;   // keep the front sand path clean
    if (rand() > dens) continue;
    const s = rr(0.016, 0.048) * (rand() < 0.08 ? 1.6 : 1);
    items.push({ x, y: terrainHeight(x, z) + s * 0.2, z, s, sy: rr(0.5, 0.85) });
  }
  for (let i = 0; i < 720; i++) {
    const s = rr(0.017, 0.04), yb = FLOOR_Y + rr(0.135, 0.24), r = rand();
    if (r < 0.34) items.push({ x: rr(-INNER_X, INNER_X), y: yb, z: INNER_Z - s * 0.55, s, sy: rr(0.6, 0.9) });
    else if (r < 0.68) items.push({ x: rr(-INNER_X, INNER_X), y: yb, z: -INNER_Z + s * 0.55, s, sy: rr(0.6, 0.9) });
    else if (r < 0.84) items.push({ x: -INNER_X + s * 0.55, y: yb, z: rr(-INNER_Z, INNER_Z), s, sy: rr(0.6, 0.9) });
    else items.push({ x: INNER_X - s * 0.55, y: yb, z: rr(-INNER_Z, INNER_Z), s, sy: rr(0.6, 0.9) });
  }
  const palette = ['#a68b68', '#77736c', '#47423c', '#8f7c62', '#b9a27e', '#5e5850', '#9a958c', '#6b5a48'].map(col);
  const mat = patchMaterial(new THREE.MeshStandardMaterial({ roughness: 0.8, metalness: 0.02, flatShading: true }), { caustics: true });
  const mesh = new THREE.InstancedMesh(new THREE.IcosahedronGeometry(1, 0), mat, items.length);
  const o = new THREE.Object3D(), c = new THREE.Color();
  items.forEach((it, i) => {
    o.position.set(it.x, it.y, it.z);
    o.rotation.set(rand() * TAU, rand() * TAU, rand() * TAU);
    o.scale.set(it.s * rr(0.85, 1.25), it.s * it.sy, it.s * rr(0.85, 1.2));
    o.updateMatrix();
    mesh.setMatrixAt(i, o.matrix);
    mesh.setColorAt(i, c.copy(pick(palette)).multiplyScalar(rr(0.85, 1.12)));
  });
  mesh.receiveShadow = true;
  mesh.name = 'gravel';
  scene.add(mesh);
}

/* ---------- rocks ---------- */
function makeRockGeometry(seed, detail = 2, rough = 0.28) {
  const g = welded(new THREE.IcosahedronGeometry(1, detail));
  const o = seed * 13.37;
  const cut = 0.8 + 0.12 * vnoise(o, 1.1, 2.3);
  return displace(g, (v) => {
    const n = fbm(v.x * 1.3 + o, v.y * 1.3 - o, v.z * 1.3 + o * 0.5, 4);
    v.multiplyScalar(1 + n * rough * 1.8 + 0.05 * vnoise(v.x * 5 + o, v.y * 5, v.z * 5));
    if (v.x > cut) v.x = cut + (v.x - cut) * 0.25;           // chiselled facet
    if (v.y < -0.35) v.y = -0.35 + (v.y + 0.35) * 0.25;     // flattened base
  });
}
function rockColors(geo, baseHex, seed) {
  const b = col(baseHex), dark = b.clone().multiplyScalar(0.5), light = b.clone().lerp(col('#c2b9a8'), 0.4), moss = col('#4d6a3a');
  const n = geo.attributes.normal;
  return setVertexColors(geo, (v, c, i) => {
    const f = fbm(v.x * 2.5 + seed, v.y * 2.5, v.z * 2.5 - seed, 3);
    c.copy(b).lerp(dark, smooth(0.05, -0.4, f) * 0.85).lerp(light, smooth(0.1, 0.5, f) * 0.7);
    c.lerp(moss, smooth(0.5, 0.95, n.getY(i)) * smooth(-0.1, 0.4, vnoise(v.x * 4 + seed, v.y * 4, v.z * 4)) * 0.55);
    c.multiplyScalar(0.92 + 0.1 * vnoise(v.x * 11, v.y * 11 + seed, v.z * 11));
  });
}

/* ---------- 7a. Driftwood arch ---------- */
const ARCH = { x: 1.95, front: V3(1.95, -0.95, 1.05), mid: V3(1.95, -1.0, -0.4), back: V3(1.95, -0.9, -1.18) };

/** Tube with varying radius, bark grooves stretched along the wood and weathered vertex colours. */
function makeBranchGeometry(points, radiusFn, seed = 0, segments = 48, radial = 10) {
  const curve = new THREE.CatmullRomCurve3(points, false, 'catmullrom', 0.5);
  const frames = curve.computeFrenetFrames(segments, false);
  const len = curve.getLength();
  const pos = [], colA = [], idx = [];
  const P = new THREE.Vector3(), N = new THREE.Vector3(), c = new THREE.Color();
  const bark = col('#3b2a1d'), barkLight = col('#7a6249'), barkDark = col('#1f150d'), mossy = col('#4c5a33');
  for (let i = 0; i <= segments; i++) {
    const t = i / segments;
    curve.getPointAt(t, P);
    const r0 = radiusFn(t);
    for (let j = 0; j <= radial; j++) {
      const a = (j / radial) * TAU, ca = Math.cos(a), sa = Math.sin(a);
      N.copy(frames.normals[i]).multiplyScalar(ca).addScaledVector(frames.binormals[i], sa);
      const g = vnoise(ca * 2.4 + seed, sa * 2.4 - seed, t * len * 1.4 + seed * 3);
      const k = fbm(ca * 1.2 + seed, sa * 1.2, t * len * 0.5 - seed, 2);
      const r = r0 * (1 + 0.16 * g + 0.12 * k);
      pos.push(P.x + N.x * r, P.y + N.y * r, P.z + N.z * r);
      c.copy(bark).lerp(barkLight, smooth(0.15, 0.6, g) * 0.75).lerp(barkDark, smooth(-0.1, -0.55, g) * 0.8);
      if (N.y > 0.5) c.lerp(mossy, smooth(0.5, 0.95, N.y) * 0.4 * smooth(-0.2, 0.4, vnoise(P.x * 5, P.y * 5, P.z * 5)));
      colA.push(c.r, c.g, c.b);
    }
  }
  const row = radial + 1;
  for (let i = 0; i < segments; i++) for (let j = 0; j < radial; j++) {
    const a = i * row + j, b = a + row;
    idx.push(a, a + 1, b, a + 1, b + 1, b);
  }
  const geometry = new THREE.BufferGeometry();
  geometry.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  geometry.setAttribute('color', new THREE.Float32BufferAttribute(colA, 3));
  geometry.setIndex(idx);
  geometry.computeVertexNormals();
  return { geometry, curve };
}

function createDriftwood() {
  const H = terrainHeight;
  const group = new THREE.Group();
  group.name = 'driftwood';
  // DoubleSide keeps lighting correct regardless of tube winding.
  const mat = patchMaterial(new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.93, metalness: 0, side: THREE.DoubleSide }), { caustics: true });
  const add = (pts, rf, seed, seg = 48, obstacleSamples = 0) => {
    const { geometry, curve } = makeBranchGeometry(pts, rf, seed, seg);
    const m = new THREE.Mesh(geometry, mat);
    m.castShadow = m.receiveShadow = true;
    group.add(m);
    for (let i = 0; i < obstacleSamples; i++) {
      const t = (i + 0.5) / obstacleSamples;
      OBSTACLES.push({ c: curve.getPointAt(t), r: rf(t) + 0.07, tag: 'wood' });
    }
    return curve;
  };
  const yL = H(1.05, -0.44), yR = H(2.92, -0.2);
  const mainR = (t) => 0.125 - 0.035 * t + 0.03 * Math.exp(-(((t - 0.32) / 0.05) ** 2)) + 0.02 * Math.exp(-(((t - 0.7) / 0.04) ** 2));
  const main = add([V3(0.72, yL - 0.12, -0.5), V3(1.08, yL + 0.1, -0.44), V3(1.3, -1.05, -0.4), V3(1.6, -0.42, -0.36), V3(2.02, -0.16, -0.32),
    V3(2.45, -0.34, -0.28), V3(2.72, -0.92, -0.24), V3(2.92, yR + 0.08, -0.2), V3(3.2, yR - 0.1, -0.1)], mainR, 1, 80, 16);
  const trunkR = (t) => 0.095 - 0.03 * t;
  add([V3(0.98, H(0.98, -0.98) - 0.1, -0.98), V3(1.35, -1.1, -0.9), V3(1.75, -0.38, -0.78), V3(2.25, -0.22, -0.66), V3(2.7, -0.55, -0.62),
    V3(3.08, H(3.08, -0.72) + 0.04, -0.75)], trunkR, 2, 64, 12);
  const branch = (curve, t0, offsets, r0, seed, samples = 0) => {
    const p0 = curve.getPointAt(t0);
    return add([p0.clone(), ...offsets.map((d) => p0.clone().add(d))], (t) => r0 * (1 - 0.85 * t) + 0.005, seed, 32, samples);
  };
  const b1 = branch(main, 0.36, [V3(-0.12, 0.35, -0.05), V3(-0.18, 0.7, 0.05), V3(-0.38, 1.05, 0.12)], 0.07, 3, 4);
  const b2 = branch(main, 0.55, [V3(0.15, 0.3, 0.1), V3(0.35, 0.62, 0.18), V3(0.42, 0.95, 0.3)], 0.065, 4, 4);
  branch(b2, 0.55, [V3(0.2, 0.12, -0.1), V3(0.38, 0.2, -0.22)], 0.03, 5);
  branch(b1, 0.6, [V3(-0.2, 0.08, 0.1), V3(-0.33, 0.1, 0.26)], 0.028, 6);
  branch(main, 0.74, [V3(0.12, 0.25, -0.25), V3(0.15, 0.55, -0.48)], 0.05, 7, 2);
  // thin roots creeping over the sand and around stones
  const root = (pts, r0, seed) => add(pts.map(([x, z, dy]) => V3(x, H(x, z) + dy, z)), (t) => r0 * (1 - 0.8 * t) + 0.004, seed, 32);
  root([[0.9, -0.47, -0.02], [0.62, -0.3, 0.015], [0.32, -0.16, 0.0], [0.05, -0.05, -0.02]], 0.045, 8);
  root([[3.05, -0.15, 0.0], [3.15, 0.1, 0.02], [3.1, 0.35, 0.01], [2.95, 0.55, -0.02]], 0.04, 9);
  root([[1.1, -0.95, -0.02], [1.4, -1.25, 0.02], [1.7, -1.4, 0.0]], 0.035, 10);
  scene.add(group);

  // moss tufts along the upper side of the arch
  for (let i = 0; i < 9; i++) {
    const t = 0.18 + i * 0.075 + rr(-0.02, 0.02);
    const p = main.getPointAt(t);
    addMoss(p.x, p.y + mainR(t) * 0.85, p.z, 0.07, 9, 0.02, 0.018, 0.04);
  }
  POIS.push({ p: V3(1.5, -0.95, 0.65), look: V3(1.95, -1.0, -0.4) });
}

/* ---------- 7b. Sunken temple ruins ---------- */
function chip(geo, amp, freq, seed) {
  return displace(geo, (v) => {
    const x = v.x, y = v.y, z = v.z;
    v.x += vnoise(x * freq + seed, y * freq, z * freq) * amp;
    v.y += vnoise(x * freq, y * freq + seed, z * freq + 7) * amp;
    v.z += vnoise(x * freq - 3, y * freq, z * freq + seed) * amp;
  });
}
function stoneColors(geo, baseHex, seed, groundY) {
  const base = col(baseHex), dark = base.clone().multiplyScalar(0.55), light = base.clone().lerp(col('#cfd5c6'), 0.4), algae = col('#4a6340');
  return setVertexColors(geo, (v, c) => {
    const n = fbm(v.x * 3.1 + seed, v.y * 3.1, v.z * 3.1 - seed, 3), m = vnoise(v.x * 11 + seed, v.y * 11, v.z * 11);
    c.copy(base).lerp(dark, smooth(0.0, -0.45, n) * 0.85).lerp(light, smooth(0.12, 0.5, n) * 0.6);
    c.lerp(algae, smooth(groundY + 0.28, groundY, v.y) * 0.5);
    c.multiplyScalar(0.9 + m * 0.12);
  });
}
function flutedColumn(radius, height, broken, seed) {
  const g = new THREE.CylinderGeometry(radius * 0.96, radius, height, 32, 10, false);
  return displace(g, (v) => {
    const a = Math.atan2(v.z, v.x), r = Math.hypot(v.x, v.z);
    if (r > radius * 0.5) {
      const k = 1 - 0.05 * Math.max(0, Math.cos(a * 12));
      v.x *= k; v.z *= k;
    }
    if (broken && v.y > height / 2 - 0.01) v.y -= (0.06 + 0.12 * (vnoise(Math.cos(a) * 3 + seed, Math.sin(a) * 3, seed) * 0.5 + 0.5)) * (0.5 + 0.5 * r / radius);
  });
}
function arcShape(R, r, a0, a1) {
  const s = new THREE.Shape();
  s.absarc(0, 0, R, a0, a1, false);
  s.absarc(0, 0, r, a1, a0, true);
  s.closePath();
  return s;
}

function createRuins() {
  const H = terrainHeight;
  const geos = [];
  const tmp = new THREE.Object3D();
  const piece = (geo, x, y, z, rx, ry, rz, hex, seed, chipAmp = 0.012, extra = null) => {
    if (chipAmp > 0) chip(geo, chipAmp, 7, seed);
    tmp.position.set(x, y, z); tmp.rotation.set(rx, ry, rz); tmp.scale.set(1, 1, 1); tmp.updateMatrix();
    geo.applyMatrix4(tmp.matrix);
    if (extra) geo.applyMatrix4(extra);
    // normals come from chip() on the indexed geometry, so smooth parts stay smooth after un-indexing
    const g = geo.index ? geo.toNonIndexed() : geo;
    for (const name of Object.keys(g.attributes)) if (name !== 'position' && name !== 'normal') g.deleteAttribute(name);
    stoneColors(g, hex, seed, RUIN.y);
    geos.push(g);
  };
  const Y = RUIN.y;
  const slabTop = Y + 0.06;
  piece(new THREE.BoxGeometry(1.35, 0.16, 0.86, 8, 1, 5), -2.5, Y - 0.02, -1.05, 0.02, 0.12, -0.02, '#6e7772', 1);
  piece(new THREE.BoxGeometry(0.55, 0.1, 0.4, 4, 1, 3), -1.86, H(-1.86, -0.6) - 0.01, -0.6, 0.06, -0.35, 0.1, '#818b82', 2);
  piece(new THREE.BoxGeometry(0.3, 0.14, 0.26, 3, 2, 3), -3.12, H(-3.12, -0.48) + 0.02, -0.48, 0.2, 0.6, 0.15, '#59645d', 3);
  // intact column with plinth and capital
  const cx = -2.92, cz = -1.28;

  piece(new THREE.BoxGeometry(0.31, 0.07, 0.31, 2, 1, 2), cx + 0.027, slabTop + 1.34, cz, 0, 0.1, 0.02, '#6e7772', 7);
  // broken column
  const bx = -2.08, bz = -1.3;
  piece(new THREE.BoxGeometry(0.32, 0.08, 0.32, 2, 1, 2), bx, slabTop + 0.04, bz, 0, -0.2, 0, '#59645d', 8);
  piece(flutedColumn(0.115, 0.62, true, 9), bx, slabTop + 0.08 + 0.31, bz, 0, -0.2, -0.03, '#818b82', 9, 0.006);
  // fallen drum, half buried
  piece(flutedColumn(0.11, 0.32, false, 10), -1.62, H(-1.62, -0.98) + 0.05, -0.98, 0, 0.5, Math.PI / 2, '#6e7772', 10, 0.008);
  // cracked arch on two pillars
  const ax = -2.45, az = -0.82;
  piece(new THREE.BoxGeometry(0.14, 0.56, 0.17, 2, 4, 2), ax - 0.315, slabTop + 0.28, az, 0, 0, 0.0, '#6e7772', 11);
  piece(new THREE.BoxGeometry(0.14, 0.56, 0.17, 2, 4, 2), ax + 0.315, slabTop + 0.28, az, 0, 0, 0.02, '#6e7772', 12);
  const ext = { depth: 0.15, bevelEnabled: true, bevelThickness: 0.012, bevelSize: 0.012, bevelSegments: 1, curveSegments: 18 };
  piece(new THREE.ExtrudeGeometry(arcShape(0.385, 0.245, 0, Math.PI * 0.47), ext), ax, slabTop + 0.56, az - 0.075, 0, 0, 0, '#818b82', 13, 0.008);
  const crack = new THREE.Matrix4().makeTranslation(ax - 0.315, slabTop + 0.56, az)
    .multiply(new THREE.Matrix4().makeRotationZ(-0.045)).multiply(new THREE.Matrix4().makeTranslation(-(ax - 0.315), -(slabTop + 0.56), -az));
  piece(new THREE.ExtrudeGeometry(arcShape(0.385, 0.245, Math.PI * 0.535, Math.PI), ext), ax, slabTop + 0.56, az - 0.075, 0, 0, 0, '#818b82', 14, 0.008, crack);
  // slab leaning against the broken column
  piece(new THREE.BoxGeometry(0.42, 0.05, 0.28, 3, 1, 2), -1.86, Y + 0.14, -1.2, 0.1, 0.4, 0.95, '#59645d', 15);
  // small staircase stepping down to the sand
  for (let k = 0; k < 3; k++) {
    const z = -0.56 + k * 0.15, top = slabTop - (k + 1) * 0.07;
    const ground = H(-2.45, z) - 0.06, hgt = Math.max(0.06, top - ground);
    piece(new THREE.BoxGeometry(0.62 - k * 0.04, hgt, 0.16, 4, 1, 1), -2.45 + k * 0.02, ground + hgt / 2, z, 0, 0.03 * k, 0, k % 2 ? '#6e7772' : '#59645d', 16 + k);
  }
  // fragment of a statue head lying on the sand
  const head = new THREE.Matrix4().compose(V3(-1.9, H(-1.9, -0.2) + 0.08, -0.2), new THREE.Quaternion().setFromEuler(new THREE.Euler(0.2, -0.7, 1.3)), V3(1, 1, 1));
  const hp = (geo, x, y, z, rx = 0, ry = 0, rz = 0, seed = 20) => piece(geo, x, y, z, rx, ry, rz, '#7a8478', seed, 0.006, head);
  hp(new THREE.SphereGeometry(0.17, 24, 18).scale(0.85, 1.05, 0.95), 0, 0, 0);
  hp(new THREE.BoxGeometry(0.05, 0.09, 0.07), 0, -0.01, 0.16, -0.25, 0, 0, 21);

  const mat = patchMaterial(new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.92, metalness: 0 }), { caustics: true });
  const mesh = new THREE.Mesh(mergeGeometries(geos, false), mat);
  mesh.name = 'templeRuins';

  // moss growing over the stones

  OBSTACLES.push(
    { c: V3(cx, slabTop + 0.5, cz), r: 0.22, tag: 'ruin' }, { c: V3(cx, slabTop + 1.1, cz), r: 0.24, tag: 'ruin' },

  POIS.push({ p: V3(ax, slabTop + 0.38, -0.4), look: V3(ax, slabTop + 0.36, az) });
}

/* ---------- 7c. Treasure chest with bubble surprise ---------- */
function createChest() {
  const g = new THREE.Group();
  g.name = 'treasureChest';
  const W = 0.62, D = 0.4, HB = 0.3, T = 0.035;
  const plank = (geo, seed) => setVertexColors(geo, (v, c) => {
    const n = vnoise(v.x * 7 + seed, v.y * 22, v.z * 7 - seed);
    c.set('#4a2c17').lerp(col('#26150a'), 0.3 + 0.35 * n).lerp(col('#6a4a2c'), smooth(0.3, 0.8, vnoise(v.x * 18, v.y * 3 + seed, v.z * 18)) * 0.35);
  });
  const woodMat = patchMaterial(new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.85 }), { caustics: true });
  const woodIn = new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.9, side: THREE.DoubleSide });
  const metalMat = new THREE.MeshStandardMaterial({ color: 0x8c6a32, metalness: 0.85, roughness: 0.38 });
  const goldMat = new THREE.MeshStandardMaterial({ color: 0xe0b04a, metalness: 1.0, roughness: 0.24, emissive: 0x7a4a00, emissiveIntensity: 0.1 });
  const pearlMat = new THREE.MeshStandardMaterial({ color: 0xf5f1e8, roughness: 0.18, metalness: 0.15, emissive: 0x3c6070, emissiveIntensity: 0.5 });
  const box = (w, h, d, x, y, z, mat, seg = [1, 1, 1], seed = 0) => {
    const geo = new THREE.BoxGeometry(w, h, d, ...seg);
    if (mat === woodMat) plank(geo, seed);
    const m = new THREE.Mesh(geo, mat);
    m.position.set(x, y, z);
    g.add(m);
    return m;
  };
  box(W, T, D, 0, T / 2, 0, woodMat, [4, 1, 3], 1);
  box(W, HB, T, 0, HB / 2, D / 2 - T / 2, woodMat, [8, 8, 1], 2);
  box(W, HB, T, 0, HB / 2, -D / 2 + T / 2, woodMat, [8, 8, 1], 3);
  box(T, HB, D - 2 * T, -W / 2 + T / 2, HB / 2, 0, woodMat, [1, 8, 6], 4);
  box(T, HB, D - 2 * T, W / 2 - T / 2, HB / 2, 0, woodMat, [1, 8, 6], 5);
  // treasure inside
  box(W - 2 * T, 0.02, D - 2 * T, 0, HB * 0.8, 0, goldMat);
  const coins = new THREE.InstancedMesh(new THREE.CylinderGeometry(0.03, 0.03, 0.007, 14), goldMat, 30);
  const o = new THREE.Object3D();
  for (let i = 0; i < 30; i++) {
    const x = rr(-W / 2 + 0.07, W / 2 - 0.07), z = rr(-D / 2 + 0.07, D / 2 - 0.07);
    o.position.set(x, HB * 0.8 + 0.012 + 0.045 * (1 - (x / (W / 2)) ** 2) * (1 - (z / (D / 2)) ** 2) + rr(0, 0.01), z);
    o.rotation.set(rr(-0.5, 0.5), rand() * TAU, rr(-0.5, 0.5));
    o.updateMatrix();
    coins.setMatrixAt(i, o.matrix);
  }
  g.add(coins);
  for (const [x, z] of [[-0.12, 0.05], [0.1, -0.06], [0.17, 0.08]]) {
    const pearl = new THREE.Mesh(new THREE.SphereGeometry(0.026, 14, 10), pearlMat);
    pearl.position.set(x, HB * 0.8 + 0.06, z);
    g.add(pearl);
  }
  const glowMat = new THREE.MeshBasicMaterial({ color: 0xffc46b, transparent: true, opacity: 0, blending: THREE.AdditiveBlending, depthWrite: false });
  const glow = new THREE.Mesh(new THREE.PlaneGeometry(W - 2 * T, D - 2 * T), glowMat);
  glow.rotation.x = -Math.PI / 2;
  glow.position.y = HB * 0.8 + 0.075;
  g.add(glow);
  // metal bands, rim and lock
  for (const sx of [-1, 1]) {
    box(0.045, HB + 0.006, 0.012, sx * W * 0.32, HB / 2, D / 2 + 0.004, metalMat);
    box(0.045, HB + 0.006, 0.012, sx * W * 0.32, HB / 2, -D / 2 - 0.004, metalMat);
    box(0.012, HB + 0.006, 0.045, sx * (W / 2 + 0.004), HB / 2, 0, metalMat);
    box(0.014, 0.03, D + 0.014, sx * (W / 2 + 0.005), HB - 0.015, 0, metalMat);
  }
  box(W + 0.014, 0.03, 0.014, 0, HB - 0.015, D / 2 + 0.005, metalMat);
  box(W + 0.014, 0.03, 0.014, 0, HB - 0.015, -D / 2 - 0.005, metalMat);
  box(0.09, 0.11, 0.01, 0, HB - 0.07, D / 2 + 0.009, metalMat);
  box(0.07, 0.06, 0.028, 0, HB - 0.115, D / 2 + 0.024, goldMat);
  box(0.012, 0.022, 0.004, 0, HB - 0.12, D / 2 + 0.039, new THREE.MeshBasicMaterial({ color: 0x120a04 }));
  const shackle = new THREE.Mesh(new THREE.TorusGeometry(0.022, 0.006, 6, 14, Math.PI), metalMat);
  shackle.position.set(0, HB - 0.085, D / 2 + 0.024);
  g.add(shackle);

  // curved lid on a hinge at the back top edge
  const lidPivot = new THREE.Group();
  lidPivot.position.set(0, HB, -D / 2);
  g.add(lidPivot);
  const lidGeo = new THREE.CylinderGeometry(D / 2, D / 2, W, 24, 6, true, 0, Math.PI).rotateZ(Math.PI / 2);
  plank(lidGeo, 6);
  const lid = new THREE.Mesh(lidGeo, woodIn);
  lid.position.set(0, 0, D / 2);
  lidPivot.add(lid);
  for (const sx of [-1, 1]) {
    const capGeo = new THREE.CircleGeometry(D / 2, 24, 0, Math.PI).rotateY(sx * Math.PI / 2);
    plank(capGeo, 7);
    const capM = new THREE.Mesh(capGeo, woodIn);
    capM.position.set(sx * W / 2, 0, D / 2);
    lidPivot.add(capM);
    const band = new THREE.Mesh(new THREE.CylinderGeometry(D / 2 + 0.008, D / 2 + 0.008, 0.045, 24, 1, true, 0, Math.PI).rotateZ(Math.PI / 2), new THREE.MeshStandardMaterial({ color: 0x8c6a32, metalness: 0.85, roughness: 0.38, side: THREE.DoubleSide }));
    band.position.set(sx * W * 0.32, 0, D / 2);
    lidPivot.add(band);
  }
  const hasp = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.07, 0.01), metalMat);
  hasp.position.set(0, -0.02, D + 0.006);
  lidPivot.add(hasp);

  const light = new THREE.PointLight(0xffb347, 0, 2.4, 2);
  light.position.set(0, HB * 0.9, 0);
  g.add(light);

  const x = 2.72, z = 0.55;
  g.position.set(x, terrainHeight(x, z) - 0.09, z);
  g.rotation.set(-0.05, 0.5, 0.07);
  shadows(g);
  glow.castShadow = false;
  scene.add(g);

  // spilled coins and glowing pearls on the sand
  const spill = new THREE.InstancedMesh(coins.geometry, goldMat, 9);
  for (let i = 0; i < 9; i++) {
    const sx = x + rr(-0.55, 0.15), sz = z + rr(0.25, 0.55);
    o.position.set(sx, terrainHeight(sx, sz) + 0.004, sz);
    o.rotation.set(rr(-0.25, 0.25), rand() * TAU, rr(-0.25, 0.25));
    o.updateMatrix();
    spill.setMatrixAt(i, o.matrix);
  }
  spill.receiveShadow = true;
  scene.add(spill);
  const pearls = [];
  for (const [px, pz] of [[2.28, 0.86], [2.36, 0.95], [3.12, 0.82], [2.2, 0.7]]) {
    const p = new THREE.Mesh(new THREE.SphereGeometry(0.03, 14, 10), pearlMat);
    p.position.set(px, terrainHeight(px, pz) + 0.022, pz);
    scene.add(p);
    pearls.push(p);
  }

  OBSTACLES.push({ c: V3(x, g.position.y + 0.2, z), r: 0.44, tag: 'chest' });
  POIS.push({ p: V3(2.3, g.position.y + 0.62, 1.0), look: V3(x, g.position.y + 0.2, z) });

  const st = { phase: 'closed', t: 0, next: rr(6, 9), open: 0, angle: 0.5, boost: 0, hold: 2.2 };
  const emitPoint = new THREE.Vector3();
  function burst(strong) {
    emitPoint.set(0, HB + 0.06, 0.05);
    g.localToWorld(emitPoint);
    bubbles.burst(emitPoint, strong ? 16 : Math.round(rr(8, 13)), strong);
  }
  function trigger(clicked) {
    if (st.phase === 'closed' || st.phase === 'closing') {
      st.t = st.phase === 'closing' ? st.open * 1.5 : 0;
      st.phase = 'opening';
      st.angle = clicked ? 0.85 : 0.5;
      st.boost = clicked ? 0.9 : 0;
      st.hold = clicked ? 3.0 : rr(1.8, 2.6);
    } else if (clicked) {
      st.boost = 0.9; st.angle = 0.85; st.t = 0;
      if (st.phase === 'open') burst(true);
    }
  }
  function update(dt) {
    switch (st.phase) {
      case 'closed': st.next -= dt; if (st.next <= 0) trigger(false); break;
      case 'opening': st.t += dt; st.open = easeInOut(st.t / 1.5); if (st.t >= 1.5) { st.phase = 'open'; st.t = 0; burst(st.boost > 0); } break;
      case 'open': st.t += dt; st.open = 1; if (st.t >= st.hold) { st.phase = 'closing'; st.t = 0; } break;
      case 'closing': st.t += dt; st.open = 1 - easeInOut(st.t / 1.8); if (st.t >= 1.8) { st.phase = 'closed'; st.open = 0; st.next = rr(12, 20); st.boost = 0; } break;
    }
    lidPivot.rotation.x = -st.open * st.angle;
    const night = U.uNight.value;
    const glowAmt = st.open * (1 + st.boost);
    light.intensity = 0.25 * night + glowAmt * 2.4;
    glowMat.opacity = glowAmt * 0.5;
    goldMat.emissiveIntensity = 0.1 + 0.25 * night + glowAmt * 0.9;
    pearlMat.emissiveIntensity = 0.45 + 0.9 * night;
  }
  return { group: g, update, trigger };
}

/* ---------- 7d. Sunken bottle with a ship inside ---------- */
function createBottle() {
  const g = new THREE.Group();
  g.name = 'bottle';
  const profile = [[0, 0], [0.165, 0], [0.19, 0.03], [0.2, 0.12], [0.2, 0.46], [0.185, 0.53], [0.12, 0.61], [0.068, 0.67], [0.06, 0.8], [0.074, 0.82], [0.074, 0.85], [0.058, 0.86]]
    .map(([r, y]) => new THREE.Vector2(r, y));
  const glassMat = new THREE.MeshPhysicalMaterial({ color: 0xa8e6cf, transparent: true, opacity: 0.3, roughness: 0.04, metalness: 0, clearcoat: 1, clearcoatRoughness: 0.05, side: THREE.DoubleSide, depthWrite: false, envMapIntensity: 1.6 });
  const glass = new THREE.Mesh(new THREE.LatheGeometry(profile, 36), glassMat);
  glass.renderOrder = 2;
  g.add(glass);
  const cork = new THREE.Mesh(new THREE.CylinderGeometry(0.058, 0.05, 0.08, 14), new THREE.MeshStandardMaterial({ color: 0x8a6a45, roughness: 0.95 }));
  cork.position.y = 0.86;
  g.add(cork);

  const x = -2.35, z = 1.1;
  g.position.set(x, terrainHeight(x, z) + 0.07, z);
  g.rotation.set(0.12, -0.6, 1.3);
  g.updateMatrixWorld();

  // A tiny ship, kept upright in world space inside the tilted bottle.
  const ship = new THREE.Group();
  const qInv = g.quaternion.clone().invert();
  ship.quaternion.copy(qInv).multiply(new THREE.Quaternion().setFromEuler(new THREE.Euler(0, 0.4, 0)));
  const downLocal = V3(0, -1, 0).applyQuaternion(qInv);
  downLocal.addScaledVector(UP, -downLocal.y).normalize();
  ship.position.set(0, 0.29, 0).addScaledVector(downLocal, 0.12);
  const sea = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.03, 0.12), new THREE.MeshStandardMaterial({ color: 0x2f6fa3, roughness: 0.55 }));
  sea.position.y = -0.03;
  const hullShape = new THREE.Shape([new THREE.Vector2(-0.12, 0), new THREE.Vector2(0.09, 0), new THREE.Vector2(0.15, 0.045), new THREE.Vector2(-0.13, 0.05)]);
  const hull = new THREE.Mesh(new THREE.ExtrudeGeometry(hullShape, { depth: 0.055, bevelEnabled: false }).translate(0, 0, -0.0275), new THREE.MeshStandardMaterial({ color: 0x5a3519, roughness: 0.7 }));
  hull.position.y = -0.018;
  ship.add(sea, hull);
  const mastMat = new THREE.MeshStandardMaterial({ color: 0x3b2410 });
  const sailMat = new THREE.MeshStandardMaterial({ color: 0xefe6cf, roughness: 0.8, side: THREE.DoubleSide });
  for (const [mx, h] of [[-0.045, 0.15], [0.05, 0.17]]) {
    const mast = new THREE.Mesh(new THREE.CylinderGeometry(0.0035, 0.0035, h, 6), mastMat);
    mast.position.set(mx, 0.03 + h / 2, 0);
    ship.add(mast);
    for (const [sy, sw] of [[0.07, 0.075], [0.13, 0.055]]) {
      const sailGeo = displace(new THREE.PlaneGeometry(sw, sw * 0.75, 4, 1).rotateY(Math.PI / 2), (v) => { v.x += 0.01 * Math.cos((v.z / sw) * Math.PI); });
      const sail = new THREE.Mesh(sailGeo, sailMat);
      sail.position.set(mx + 0.004, 0.03 + sy, 0);
      ship.add(sail);
    }
  }
  const flag = new THREE.Mesh(new THREE.PlaneGeometry(0.03, 0.016), new THREE.MeshStandardMaterial({ color: 0xb8352a, side: THREE.DoubleSide }));
  flag.position.set(0.065, 0.215, 0);
  ship.add(flag);
  const lantern = new THREE.Mesh(new THREE.SphereGeometry(0.008, 8, 6), new THREE.MeshBasicMaterial({ color: new THREE.Color(2.2, 1.4, 0.6) }));
  lantern.position.set(-0.115, 0.07, 0);
  ship.add(lantern);
  g.add(ship);
  shadows(ship, false, true);
  scene.add(g);
  OBSTACLES.push({ c: V3(x, g.position.y + 0.05, z), r: 0.36, tag: 'bottle' });
  POIS.push({ p: V3(-2.0, g.position.y + 0.42, 0.78), look: V3(x, g.position.y, z) });
  return { group: g, lantern };
}

/* ---------- 7e. Small handcrafted details ---------- */
function makeSpiralShellGeometry({ turns = 3.1, b = 0.18, tube = 0.6, helix = 0.5, size = 0.06, segU = 96, segV = 14, c1 = '#9b6a44', c2 = '#efe1c6' } = {}) {
  const umax = turns * TAU, gmax = Math.exp(b * umax), k = size / gmax;
  const pos = [], colA = [], idx = [], c = new THREE.Color(), A = col(c1), B = col(c2);
  for (let i = 0; i <= segU; i++) {
    const u = (i / segU) * umax, g = Math.exp(b * u) * k, rt = g * tube;
    const cx = g * Math.cos(u), cz = g * Math.sin(u), cy = -helix * g;
    for (let j = 0; j <= segV; j++) {
      const v = (j / segV) * TAU;
      pos.push(cx + rt * Math.cos(v) * Math.cos(u), cy + rt * Math.sin(v), cz + rt * Math.cos(v) * Math.sin(u));

    const a = (i / 10) * TAU + Math.PI / 2, rad = i % 2 === 0 ? R : r;
    pts.push(new THREE.Vector2(Math.cos(a) * rad, Math.sin(a) * rad));

function makeLeafGeometry({ stem = 0.15, width = 0.3, cup = 0.05, bend = 0.3, wavy = 0, base = '#2e6b30', tipC = '#76b84d', rib = '#a6d47c', stemC = '#5f8f3f', segU = 6, segV = 16 } = {}) {
  const pos = [], colA = [], idx = [], c = new THREE.Color();
  const B = col(base), T = col(tipC), R = col(rib), S = col(stemC);
  for (let i = 0; i <= segV; i++) {
    const v = i / segV, q = clamp((v - stem) / (1 - stem), 0, 1);
    const blade = width * Math.pow(Math.sin(Math.PI * Math.min(q, 0.999)), 0.8) * (1 - 0.25 * q);
    const hw = Math.max(v < stem + 0.04 ? 0.022 : 0.002, blade);
    for (let j = 0; j <= segU; j++) {
      const u = (j / segU) * 2 - 1;
      const z = bend * v * v + (v > stem ? cup * u * u : 0) + wavy * 0.03 * Math.sin(v * 38 + u * 2) * Math.abs(u);
      pos.push(u * hw, v, z);
      if (v < stem) c.copy(S);
      else c.copy(B).lerp(T, smooth(stem, 1, v)).lerp(R, (1 - smooth(0.0, 0.2, Math.abs(u))) * 0.45);
      colA.push(c.r, c.g, c.b);
    }
  }
  const row = segU + 1;
  for (let i = 0; i < segV; i++) for (let j = 0; j < segU; j++) { const a = i * row + j, b = a + row; idx.push(a, b, a + 1, b, b + 1, a + 1); }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('color', new THREE.Float32BufferAttribute(colA, 3));
  g.setIndex(idx);
  g.computeVertexNormals();
  return g;
}
/** Builds one instanced, swaying plant layer from a list of instance transforms. */
function instancedPlant(geo, mat, list) {
  const mesh = new THREE.InstancedMesh(geo, mat, list.length);
  const phases = new Float32Array(list.length);
  const o = new THREE.Object3D(), c = new THREE.Color();
  list.forEach((it, i) => {
    o.position.copy(it.p);
    o.quaternion.setFromEuler(it.e);
    o.scale.copy(it.s);
    o.updateMatrix();
    mesh.setMatrixAt(i, o.matrix);
    mesh.setColorAt(i, c.setRGB(...it.tint));
    phases[i] = rand() * TAU;
  });
  geo.setAttribute('aPhase', new THREE.InstancedBufferAttribute(phases, 1));
  mesh.customDepthMaterial = swayDepthMaterial(mat);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  scene.add(mesh);
  return mesh;
}

    for (let i = 0; i < cl.n; i++) {

      const x = clamp(cl.x + Math.cos(a) * r, -INNER_X + 0.05, INNER_X - 0.05), z = clamp(cl.z + Math.sin(a) * r, -INNER_Z + 0.05, INNER_Z - 0.05);
      const y = H(x, z) - 0.03;
      const h = Math.min(rr(cl.h[0], cl.h[1]) * (1 - 0.35 * r / cl.r), WATER_Y - 0.2 - y);
      blades.push({ p: V3(x, y, z), e: new THREE.Euler(rr(-0.12, 0.12), rand() * TAU, rr(-0.12, 0.12)), s: V3(rr(0.05, 0.085), h, h * 0.6), tint: [rr(0.85, 1.05), rr(0.9, 1.1), rr(0.8, 1.0)] });
    }
  }
  instancedPlant(makeBladeGeometry(), ribbonMat, blades);

  // B + C: broad-leaved rosettes near rocks/driftwood, and one red accent plant near the centre
  const leafMat = patchMaterial(new THREE.MeshStandardMaterial({ vertexColors: true, side: THREE.DoubleSide, roughness: 0.6 }),
    { sway: { amp: 0.03, speed: 0.6, wave: 1.2, pow: 2.0, lean: new THREE.Vector2(0.01, 0.0) }, caustics: true });
  const rosette = (cx, cz, n, hMin, hMax, tiltMin, tiltMax, tintFn) => {
    const list = [];
    for (let i = 0; i < n; i++) {
      const a = (i / n) * TAU + rr(-0.2, 0.2), x = cx + Math.cos(a) * 0.03, z = cz + Math.sin(a) * 0.03;
      const h = rr(hMin, hMax);
      list.push({ p: V3(x, H(x, z) - 0.02, z), e: new THREE.Euler(rr(tiltMin, tiltMax), Math.PI / 2 - a, 0, 'YXZ'), s: V3(h * 0.95, h, h * 0.95), tint: tintFn() });
    }
    return list;
  };
  const green = () => [rr(0.85, 1.05), rr(0.9, 1.1), rr(0.85, 1.0)];
  instancedPlant(makeLeafGeometry(), leafMat, [...rosette(-0.55, -0.78, 11, 0.4, 0.62, 0.25, 0.85, green), ...rosette(0.72, -0.22, 9, 0.36, 0.55, 0.3, 0.9, green)]);
  instancedPlant(makeLeafGeometry({ stem: 0.42, width: 0.34, cup: 0.04, bend: 0.22, wavy: 1, base: '#6e1d2a', tipC: '#c4472b', rib: '#e07a55', stemC: '#5a2a24' }),
    leafMat, rosette(0.25, 0.36, 13, 0.45, 0.75, 0.15, 0.75, () => [rr(0.85, 1.1), rr(0.8, 1.0), rr(0.85, 1.1)]));

  // D: moss carpets on the sand
  addMossOnSand(0.95, 0.72, 0.2, 42);
  addMossOnSand(-0.55, 0.88, 0.16, 30);
  POIS.push({ p: V3(0.25, H(0.25, 0.36) + 0.75, 0.85), look: V3(0.25, H(0.25, 0.36) + 0.35, 0.36) });
  POIS.push({ p: V3(-2.0, 0.25, -1.0), look: V3(-2.2, 0.2, -1.6) });
  OBSTACLES.push({ c: V3(0.25, H(0.25, 0.36) + 0.3, 0.36), r: 0.28, tag: 'plant' });
}

/* ============================================================================
   9. Coral and the anemone
   ========================================================================== */
function makeTentacleGeometry(radialSegments = 8, base = 0.032, taper = 0.35, bulb = 0.014) {
  const pts = [];
  for (let i = 0; i <= 14; i++) {
    const t = i / 14;
    let r = base * (1 - taper * t) + bulb * Math.exp(-(((t - 0.86) / 0.08) ** 2));
    if (t > 0.9) r *= Math.sqrt(Math.max(0, 1 - ((t - 0.9) / 0.1) ** 2));
    pts.push(new THREE.Vector2(Math.max(r, 0.0001), t));
  }
  return new THREE.LatheGeometry(pts, radialSegments);
}
function makeTentacleMaterial(baseHex, opts = {}) {
  const mat = new THREE.MeshPhysicalMaterial({ color: 0xffffff, roughness: 0.45, clearcoat: 0.4, clearcoatRoughness: 0.4 });
  const u = {
    uBaseCol: { value: col(baseHex) }, uTipGlow: { value: 0.12 }, uPush: { value: new THREE.Vector4(0, -50, 0, 0) },
    uDroop: { value: opts.droop ?? 0.12 }, uSwayAmp: { value: opts.amp ?? 0.05 }, uSwaySpeed: { value: opts.speed ?? 0.9 },
    uSwayWave: { value: 2.2 }, uSwayPow: { value: 1.6 }, uSwayLean: { value: new THREE.Vector2(0.015, 0.0) },
  };
  mat.userData.u = u;
  const defs = '#define USE_SWAY\n#define USE_TENTACLE\n#define USE_CAUSTICS\n';
  mat.onBeforeCompile = (shader) => {
    Object.assign(shader.uniforms, u);
    shader.uniforms.uTime = U.uTime;
    shader.uniforms.uCaustic = U.uCaustic;
    shader.vertexShader = defs + VERT_DECL + shader.vertexShader
      .replace('#include <begin_vertex>', '#include <begin_vertex>\nvT = position.y;\nvTip = aTip;')
      .replace('#include <project_vertex>', PROJECT_VERTEX);
    shader.fragmentShader = defs + FRAG_DECL + 'uniform vec3 uBaseCol; uniform float uTipGlow; varying vec3 vTip; varying float vT;\n' + shader.fragmentShader
      .replace('#include <color_fragment>', 'diffuseColor.rgb = mix( uBaseCol, vTip, smoothstep( 0.22, 0.92, vT ) );')
      .replace('#include <emissivemap_fragment>', '#include <emissivemap_fragment>\ntotalEmissiveRadiance += vTip * smoothstep( 0.7, 1.0, vT ) * uTipGlow;')
      .replace('#include <opaque_fragment>', CAUSTIC_FRAGMENT + '\n#include <opaque_fragment>');
  };
  mat.customProgramCacheKey = () => 'aq-tentacle';
  return mat;
}
/** Instanced tentacles/fingers; each gets its own phase and tip colour. */
function tentacleMesh(geo, mat, list) {
  const mesh = new THREE.InstancedMesh(geo, mat, list.length);
  const phase = new Float32Array(list.length), tip = new Float32Array(list.length * 3);
  const o = new THREE.Object3D();
  list.forEach((it, i) => {
    o.position.copy(it.p);
    o.quaternion.setFromUnitVectors(UP, it.dir);
    o.scale.set(it.thick, it.len, it.thick);
    o.updateMatrix();
    mesh.setMatrixAt(i, o.matrix);
    phase[i] = rand() * TAU;
    tip[i * 3] = it.tip.r; tip[i * 3 + 1] = it.tip.g; tip[i * 3 + 2] = it.tip.b;
  });
  geo.setAttribute('aPhase', new THREE.InstancedBufferAttribute(phase, 1));
  geo.setAttribute('aTip', new THREE.InstancedBufferAttribute(tip, 3));
  mesh.receiveShadow = true;
  return mesh;
}

function createCoral() {
  const H = terrainHeight;
  const coralMat = patchMaterial(new THREE.MeshStandardMaterial({ roughness: 0.72, metalness: 0 }), { caustics: true });
  // Branching coral from recursive tapered cylinders (all colonies share two instanced meshes).
  const segs = [], knobs = [];
  function grow(p, dir, len, rad, depth, A, B, level) {
    const end = p.clone().addScaledVector(dir, len);
    segs.push({ p: p.clone(), dir: dir.clone(), len, rad, color: A.clone().lerp(B, level * 0.18) });
    if (depth === 0) { knobs.push({ p: end, r: rad * 0.95, color: B.clone() }); return; }
    knobs.push({ p: end, r: rad * 0.76, color: A.clone().lerp(B, (level + 1) * 0.18) });
    const n = depth > 2 ? 2 : (rand() < 0.55 ? 2 : 3);
    for (let k = 0; k < n; k++) {
      const nd = dir.clone().add(V3(rr(-0.75, 0.75), rr(0.0, 0.5), rr(-0.75, 0.75))).normalize();
      if (nd.y < 0.25) { nd.y = 0.25; nd.normalize(); }
      grow(end, nd, len * rr(0.7, 0.88), rad * 0.74, depth - 1, A, B, level + 1);
    }
  }
  for (const c of [
    { x: 1.0, z: 0.3, len: 0.17, rad: 0.036, depth: 4, a: '#d9774f', b: '#f2b38f' },
    { x: 2.45, z: -0.98, len: 0.15, rad: 0.03, depth: 4, a: '#c98a9b', b: '#efc6cf' },
    { x: 2.32, z: 1.38, len: 0.1, rad: 0.022, depth: 3, a: '#e2cfae', b: '#fff1dc' },
    { x: -1.0, z: -1.38, len: 0.12, rad: 0.026, depth: 3, a: '#a996c4', b: '#d9cdea' },
  ]) {
    const base = V3(c.x, H(c.x, c.z) - 0.03, c.z);
    const trunks = c.depth > 3 ? 3 : 2;
    for (let i = 0; i < trunks; i++) grow(base, V3(rr(-0.35, 0.35), 1, rr(-0.35, 0.35)).normalize(), c.len, c.rad, c.depth - 1, col(c.a), col(c.b), 0);
    OBSTACLES.push({ c: V3(c.x, base.y + c.len * 1.6, c.z), r: c.len * 1.8, tag: 'coral' });
  }
  const branchMesh = new THREE.InstancedMesh(new THREE.CylinderGeometry(0.75, 1, 1, 9, 1, true).translate(0, 0.5, 0), coralMat, segs.length);
  const knobMesh = new THREE.InstancedMesh(new THREE.SphereGeometry(1, 10, 8), coralMat, knobs.length);
  const o = new THREE.Object3D();
  segs.forEach((s, i) => {
    o.position.copy(s.p); o.quaternion.setFromUnitVectors(UP, s.dir); o.scale.set(s.rad, s.len, s.rad); o.updateMatrix();
    branchMesh.setMatrixAt(i, o.matrix); branchMesh.setColorAt(i, s.color);
  });
  knobs.forEach((k, i) => {
    o.position.copy(k.p); o.quaternion.identity(); o.scale.setScalar(k.r); o.updateMatrix();
    knobMesh.setMatrixAt(i, o.matrix); knobMesh.setColorAt(i, k.color);
  });
  for (const m of [branchMesh, knobMesh]) { shadows(m); scene.add(m); }

  // Brain coral: a low dome with meandering ridges.
  {
    const ridge = (n) => 0.5 + 0.5 * Math.cos(fbm(n.x * 2.2 + 5, n.y * 2.2, n.z * 2.2, 3) * 26);
    const g = new THREE.SphereGeometry(0.3, 110, 55, 0, TAU, 0, Math.PI * 0.6);
    const n = new THREE.Vector3();
    displace(g, (v) => { n.copy(v).normalize(); v.addScaledVector(n, 0.02 * ridge(n)); v.y *= 0.72; });
    const groove = col('#8e7a66'), crest = col('#dcc9a6'), lav = col('#b8a3c6');
    setVertexColors(g, (v, c) => {
      n.set(v.x, v.y / 0.72, v.z).normalize();
      c.copy(groove).lerp(crest, smooth(0.3, 0.9, ridge(n))).lerp(lav, smooth(-0.1, 0.4, vnoise(v.x * 4, v.y * 4, v.z * 4)) * 0.35);
    });
    const m = new THREE.Mesh(g, patchMaterial(new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.8 }), { caustics: true }));
    m.position.set(-1.5, H(-1.5, -0.75) - 0.06, -0.75);
    m.rotation.y = 0.6;
    shadows(m);
    scene.add(m);
    OBSTACLES.push({ c: V3(-1.5, m.position.y + 0.08, -0.75), r: 0.32, tag: 'coral' });
  }
  // Tube coral: hollow cylinders with dark interiors and pale rims.
  {
    const unit = new THREE.CylinderGeometry(1, 1.15, 1, 16, 1, true).translate(0, 0.5, 0);
    const n = 8, cx = 1.45, cz = -1.47;
    const outer = new THREE.InstancedMesh(unit, new THREE.MeshStandardMaterial({ roughness: 0.65, side: THREE.DoubleSide }), n);
    const inner = new THREE.InstancedMesh(unit, new THREE.MeshStandardMaterial({ color: 0x2a1d2c, roughness: 1, side: THREE.BackSide }), n);
    const rims = new THREE.InstancedMesh(new THREE.TorusGeometry(1, 0.13, 6, 18).rotateX(Math.PI / 2), new THREE.MeshStandardMaterial({ roughness: 0.6 }), n);
    const pal = ['#b6a0c9', '#d7a3b5', '#c9b6d9', '#e4c4c8'].map(col);
    const o2 = new THREE.Object3D();
    for (let i = 0; i < n; i++) {
      const a = rand() * TAU, rad = Math.sqrt(rand()) * 0.15, x = cx + Math.cos(a) * rad, z = cz + Math.sin(a) * rad;
      const r = rr(0.032, 0.058), h = rr(0.14, 0.34), y = H(x, z) - 0.03;
      const e = new THREE.Euler(rr(-0.18, 0.18), 0, rr(-0.18, 0.18));
      const c = pick(pal);
      o2.position.set(x, y, z); o2.rotation.copy(e); o2.scale.set(r, h, r); o2.updateMatrix();
      outer.setMatrixAt(i, o2.matrix); outer.setColorAt(i, c);
      o2.scale.set(r * 0.84, h * 0.985, r * 0.84); o2.updateMatrix();
      inner.setMatrixAt(i, o2.matrix);
      const top = V3(0, h, 0).applyEuler(e).add(V3(x, y, z));
      o2.position.copy(top); o2.scale.setScalar(r * 0.93); o2.updateMatrix();
      rims.setMatrixAt(i, o2.matrix); rims.setColorAt(i, c.clone().lerp(col('#fff4ee'), 0.4));
    }
    for (const m of [outer, inner, rims]) { shadows(m); scene.add(m); }
    OBSTACLES.push({ c: V3(cx, H(cx, cz) + 0.18, cz), r: 0.28, tag: 'coral' });
  }
  // Mushroom coral discs.
  {
    const g = new THREE.CylinderGeometry(0.16, 0.12, 0.05, 56, 3);
    displace(g, (v) => {
      if (v.y > 0) { const r = Math.hypot(v.x, v.z) / 0.16, a = Math.atan2(v.z, v.x); v.y += 0.012 * Math.abs(Math.sin(a * 22)) * r + 0.03 * (1 - r * r); }
    });
    const tan = col('#c99a6a'), centre = col('#8fa070');
    setVertexColors(g, (v, c) => {
      const r = Math.hypot(v.x, v.z) / 0.16, a = Math.atan2(v.z, v.x);
      c.copy(centre).lerp(tan, smooth(0.0, 0.6, r)).multiplyScalar(0.8 + 0.25 * Math.abs(Math.sin(a * 22)));
    });
    const mat = patchMaterial(new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.7 }), { caustics: true });
    for (const [x, y, z, s, rx] of [[0.6, FEATURE.slab.top - 0.04, -1.08, 1.0, 0.08], [-1.42, H(-1.42, 0.55) + 0.01, 0.55, 0.8, 0.05], [0.05, FEATURE.slab.top - 0.06, -1.2, 0.6, -0.1]]) {
      const m = new THREE.Mesh(g, mat);
      m.position.set(x, y, z); m.scale.setScalar(s); m.rotation.set(rx, rand() * TAU, 0);
      shadows(m);
      scene.add(m);
    }
  }
  // Soft coral with gently animated fingers.
  {
    const x = -3.05, z = 1.22, y = H(x, z) - 0.02;
    const grp = new THREE.Group();
    grp.position.set(x, y, z);
    const trunk = new THREE.Mesh(new THREE.LatheGeometry([[0.0, 0], [0.09, 0], [0.1, 0.05], [0.085, 0.15], [0.07, 0.25], [0.055, 0.32], [0.0, 0.34]].map(([r, h]) => new THREE.Vector2(r, h)), 18),
      new THREE.MeshStandardMaterial({ color: 0xc98a9b, roughness: 0.6 }));
    grp.add(trunk);
    const fingers = [];
    const tips = ['#f3e2d6', '#e9cfe0', '#f6efe0'].map(col);
    for (let i = 0; i < 24; i++) {
      const hgt = rr(0.06, 0.32), a = rand() * TAU, rad = 0.09 - hgt * 0.12;
      const dir = V3(Math.cos(a) * rr(0.4, 0.9), 1, Math.sin(a) * rr(0.4, 0.9)).normalize();
      fingers.push({ p: V3(Math.cos(a) * rad * 0.8, hgt, Math.sin(a) * rad * 0.8), dir, len: rr(0.12, 0.26), thick: rr(0.9, 1.3), tip: pick(tips) });
    }
    const fm = tentacleMesh(makeTentacleGeometry(7, 0.028, 0.3, 0.008), makeTentacleMaterial('#c98a9b', { droop: 0.02, amp: 0.035, speed: 0.6 }), fingers);
    grp.add(fm);
    shadows(trunk);
    scene.add(grp);
    OBSTACLES.push({ c: V3(x, y + 0.25, z), r: 0.3, tag: 'coral' });
  }
}

function createAnemone() {
  const ax = -0.85, az = -0.05;
  const g = new THREE.Group();
  g.name = 'anemone';
  g.position.set(ax, FEATURE.anemoneRock.top - 0.07, az);
  const S = 0.9;
  const profile = [[0.0, 0], [0.4, 0], [0.46, 0.05], [0.45, 0.13], [0.39, 0.23], [0.37, 0.31], [0.42, 0.4], [0.49, 0.46], [0.5, 0.5], [0.44, 0.53], [0.22, 0.55], [0.06, 0.552], [0.0, 0.54]]
    .map(([r, y]) => new THREE.Vector2(r * S, y * S));
  const baseGeo = displace(welded(new THREE.LatheGeometry(profile, 56)), (v) => {
    const k = 1 + 0.07 * fbm(v.x * 5, v.y * 5, v.z * 5, 3);
    v.x *= k; v.z *= k;
  });
  const column = col('#6e2c45'), foot = col('#4f2a50'), disc = col('#b0566e'), mouth = col('#3a1020');
  setVertexColors(baseGeo, (v, c) => {
    const r = Math.hypot(v.x, v.z) / S, a = Math.atan2(v.z, v.x);
    if (v.y > 0.5 * S && r < 0.46) c.copy(disc).lerp(mouth, 1 - smooth(0.04, 0.12, r)).multiplyScalar(0.85 + 0.2 * Math.sin(a * 24));
    else c.copy(foot).lerp(column, smooth(0.05 * S, 0.4 * S, v.y)).multiplyScalar(0.9 + 0.15 * Math.sin(a * 18 + v.y * 8));
  });
  const base = new THREE.Mesh(baseGeo, patchMaterial(new THREE.MeshPhysicalMaterial({ vertexColors: true, roughness: 0.5, clearcoat: 0.35, clearcoatRoughness: 0.4 }), { caustics: true }));
  shadows(base);
  g.add(base);

  const N = 52, list = [];
  const tipPal = [['#ff9fb5', 0.42], ['#ffb07a', 0.2], ['#f3e6c7', 0.28], ['#c8f2a8', 0.1]];
  for (let i = 0; i < N; i++) {
    const r = S * (0.1 + 0.32 * Math.sqrt((i + 0.5) / N)), a = i * 2.39996;
    const phi = 0.15 + 1.05 * (r / (0.42 * S)) + rr(-0.1, 0.15);
    let w = rand(), tip = tipPal[0][0];
    for (const [hex, p] of tipPal) { if (w < p) { tip = hex; break; } w -= p; }
    list.push({ p: V3(r * Math.cos(a), 0.55 * S - 0.01, r * Math.sin(a)), dir: V3(Math.cos(a) * Math.sin(phi), Math.cos(phi), Math.sin(a) * Math.sin(phi)), len: rr(0.38, 0.62), thick: rr(0.85, 1.25), tip: col(tip) });
  }
  const tMat = makeTentacleMaterial('#8a3a55');
  const tentacles = tentacleMesh(makeTentacleGeometry(), tMat, list);
  g.add(tentacles);
  scene.add(g);
  g.updateMatrixWorld();

  const discY = g.position.y + 0.55 * S;
  const api = {
    group: g, center: V3(ax, discY, az), discY, crownY: discY + 0.3, occupant: null, cooldown: 5,
    claim(f) { if (this.occupant || this.cooldown > 0) return false; this.occupant = f; return true; },
    release(f) { if (this.occupant === f) { this.occupant = null; this.cooldown = rr(14, 26); } },
    setGlow(v) { tMat.userData.u.uTipGlow.value = v; },
    update(dt, fishList) {
      this.cooldown -= dt;
      // tentacles part around the nearest fish
      let best = null, bd = 0.95;
      for (const f of fishList) { const d = f.pos.distanceTo(_pushTmp.set(ax, this.crownY - 0.1, az)); if (d < bd) { bd = d; best = f; } }
      const u = tMat.userData.u.uPush.value;
      if (best) { _pushTmp.copy(best.pos); g.worldToLocal(_pushTmp); u.x = _pushTmp.x; u.y = _pushTmp.y; u.z = _pushTmp.z; }
      u.w = damp(u.w, best ? 1 : 0, 3, dt);
    },
  };
  OBSTACLES.push({ c: V3(ax, discY + 0.28, az), r: 0.55, tag: 'crown' }, { c: V3(ax, discY - 0.22, az), r: 0.42, tag: 'anemoneBase' });
  return api;
}
const _pushTmp = new THREE.Vector3();

/* ============================================================================
   10. Clownfish model factory
   Local frame used by every fish calculation: +Z = forward (snout), +Y = up
   (dorsal), +X = the fish's left side. Body length = 1 model unit; s = 0 at the
   caudal peduncle, s = 1 at the snout. The group's quaternion maps +Z onto the
   swimming direction (see quatFromForward).
   ========================================================================== */
const FISH_SCALE = 0.42;
const FISH_Z0 = -0.45;
const fishZ = (s) => FISH_Z0 + s;
function fishHH(s) {
  if (s < 0.52) { const t = s / 0.52; return 0.07 + (0.215 - 0.07) * Math.pow(Math.sin(t * Math.PI * 0.5), 1.25); }
  const t = (s - 0.52) / 0.48;
  return 0.215 * Math.sqrt(Math.max(0, 1 - Math.pow(t, 2.6)));
}
const fishHW = (s) => fishHH(s) * (0.46 + 0.16 * smooth(0.55, 0.92, s));
const fishYC = (s) => 0.018 * Math.sin(Math.PI * s) - 0.028 * smooth(0.8, 1.0, s);
const fishTop = (s) => fishYC(s) + fishHH(s);
const fishBottom = (s) => fishYC(s) - fishHH(s) * 1.06;
const _mLook = new THREE.Matrix4(), _origin = new THREE.Vector3();
function quatFromForward(fwd, out) { _mLook.lookAt(fwd, _origin, UP); return out.setFromRotationMatrix(_mLook); }

let FISH_BODY_GEO = null;
function buildFishBodyGeometry() {
  const RINGS = 52, SEG = 36, pos = [], body = [], idx = [];
  for (let i = 0; i <= RINGS; i++) {
    const s = 0.5 - 0.5 * Math.cos((i / RINGS) * Math.PI);
    const hh = fishHH(s), hw = fishHW(s), yc = fishYC(s), z = fishZ(s);
    for (let j = 0; j <= SEG; j++) {
      const th = -Math.PI / 2 + (j / SEG) * TAU;   // seam runs along the belly
      const c = Math.cos(th), sn = Math.sin(th);
      const cx = Math.sign(c) * Math.pow(Math.abs(c), 0.82);
      const sy = Math.sign(sn) * Math.pow(Math.abs(sn), 0.88);
      pos.push(hw * cx, yc + hh * sy * (sy < 0 ? 1.06 : 1), z);
      body.push(s, sy);
    }
  }
  const row = SEG + 1;
  for (let i = 0; i < RINGS; i++) for (let j = 0; j < SEG; j++) {
    const a = i * row + j, b = a + row, c = a + 1, d = b + 1;
    idx.push(a, c, b, c, d, b);
  }
