  const footMat = new THREE.MeshPhysicalMaterial({ color: 0xb9ab95, roughness: 0.4, clearcoat: 0.6 });
  const foot = new THREE.Mesh(new THREE.SphereGeometry(0.05, 18, 12), footMat);
  foot.scale.set(0.7, 0.3, 1.9);
  foot.position.y = 0.014;
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.03, 14, 10), footMat);
  head.position.set(0, 0.026, 0.085);
  head.scale.set(1, 0.8, 1.15);
  const tipMat = new THREE.MeshStandardMaterial({ color: 0x1a1612 });
  const antennae = [-1, 1].map((sx) => {
    const a = new THREE.Group();
    a.position.set(sx * 0.013, 0.04, 0.1);
    a.rotation.set(0.75, 0, -sx * 0.35);
    const stalk = new THREE.Mesh(new THREE.CylinderGeometry(0.0032, 0.0048, 0.06, 6).translate(0, 0.03, 0), footMat);
    const tip = new THREE.Mesh(new THREE.SphereGeometry(0.0065, 8, 6), tipMat);
    tip.position.y = 0.062;
    a.add(stalk, tip);
    return a;
  });
  const shell = new THREE.Mesh(makeSpiralShellGeometry({ turns: 3.0, b: 0.2, tube: 0.62, helix: 0.45, size: 0.055, c1: '#6e4326', c2: '#d9b48a' }),
    new THREE.MeshPhysicalMaterial({ vertexColors: true, roughness: 0.35, clearcoat: 0.8, clearcoatRoughness: 0.2 }));
  shell.position.set(0, 0.075, -0.03);
  shell.rotation.set(0, 0, -Math.PI / 2);
  pivot.add(foot, head, ...antennae, shell);
  shadows(pivot);
  scene.add(pivot);
  const st = { y: -0.5, z: 0.15, h: 0.9 };
  return {
    update(dt, t) {
      const yMin = terrainHeight(-INNER_X + 0.1, st.z) + 0.25;
      let want = null;
      if (st.y < yMin + 0.12 || st.y > 1.2 || Math.abs(st.z) > 1.3) want = Math.atan2(-0.2 - st.y, -st.z);
      if (want !== null) {
        const d = Math.atan2(Math.sin(want - st.h), Math.cos(want - st.h));
        st.h += clamp(d, -0.5 * dt, 0.5 * dt);
      } else st.h += vnoise(t * 0.06, 4.2, 0) * 0.35 * dt;
      const sp = 0.028 * (0.75 + 0.25 * Math.sin(t * 0.7));
      st.y += Math.sin(st.h) * sp * dt;
      st.z += Math.cos(st.h) * sp * dt;
      pivot.position.set(-INNER_X + 0.003, st.y, st.z);
      const fwd = _c1.set(0, Math.sin(st.h), Math.cos(st.h)), up = _c2.set(1, 0, 0);
      _cm.makeBasis(_c3.crossVectors(up, fwd), up, fwd);
      pivot.quaternion.setFromRotationMatrix(_cm);
      antennae.forEach((a, i) => { a.rotation.x = 0.75 + Math.sin(t * 1.6 + i * 1.7) * 0.15; });
      shell.rotation.x = Math.sin(t * 0.8) * 0.05;
    },
  };
}

function createShrimp() {
  const root = new THREE.Group();
  root.name = 'cleanerShrimp';
  const body = new THREE.Group();
  root.add(body);
  const shellMat = new THREE.MeshPhysicalMaterial({ color: 0xff6a4a, roughness: 0.3, clearcoat: 0.7, transparent: true, opacity: 0.85, emissive: 0x3a0804, emissiveIntensity: 0.4 });
  const whiteMat = new THREE.MeshStandardMaterial({ color: 0xfaf4ea, roughness: 0.35 });
  const redMat = new THREE.MeshStandardMaterial({ color: 0xc8261c, roughness: 0.4 });
  const blackMat = new THREE.MeshStandardMaterial({ color: 0x050505, roughness: 0.2 });
  const segs = [[0.07, 0.035, 0.028], [0.03, 0.04, 0.024], [0.0, 0.042, 0.022], [-0.028, 0.04, 0.02], [-0.053, 0.034, 0.017], [-0.074, 0.026, 0.014], [-0.09, 0.018, 0.011]];
  segs.forEach(([z, y, r], i) => {
    const s = new THREE.Mesh(new THREE.SphereGeometry(r, 14, 10), shellMat);
    s.position.set(0, y, z);
    s.scale.set(0.8, 0.85, i === 0 ? 1.6 : 1.35);
    const stripe = new THREE.Mesh(new THREE.SphereGeometry(r * 0.35, 8, 6), whiteMat);
    stripe.position.set(0, y + r * 0.78, z);
    stripe.scale.set(0.5, 0.3, i === 0 ? 4.4 : 3.2);
    body.add(s, stripe);
  });
  for (const a of [-0.6, 0, 0.6]) {
    const fan = new THREE.Mesh(new THREE.SphereGeometry(0.014, 10, 8), a === 0 ? whiteMat : redMat);
    fan.position.set(Math.sin(a) * 0.012, 0.014, -0.108 - Math.cos(a) * 0.01);
    fan.scale.set(0.9, 0.25, 1.8);
    fan.rotation.y = a;
    body.add(fan);
  }
  for (const sx of [-1, 1]) {
    const eye = new THREE.Mesh(new THREE.SphereGeometry(0.0075, 8, 6), blackMat);
    eye.position.set(sx * 0.016, 0.05, 0.1);
    body.add(eye);
  }
  const antennae = [-1, 1].map((sx) => {
    const g = new THREE.Group();
    g.position.set(sx * 0.008, 0.045, 0.11);
    const long = new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3([V3(0, 0, 0), V3(sx * 0.04, 0.07, 0.1), V3(sx * 0.1, 0.13, 0.22), V3(sx * 0.17, 0.1, 0.36)]), 24, 0.0024, 4), whiteMat);
    const short = new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3([V3(0, 0, 0), V3(sx * 0.02, 0.03, 0.05), V3(sx * 0.03, 0.035, 0.1)]), 12, 0.002, 4), whiteMat);
    g.add(long, short);
    body.add(g);
    return g;
  });
  const legs = [];
  for (let k = 0; k < 5; k++) for (const sx of [-1, 1]) {
    const p = new THREE.Group();
    p.position.set(sx * 0.012, 0.022, 0.08 - k * 0.022);
    p.rotation.z = sx * 0.5;
    const leg = new THREE.Mesh(new THREE.CylinderGeometry(0.0022, 0.0018, 0.05, 4).translate(0, -0.025, 0), k % 2 ? whiteMat : redMat);
    p.add(leg);
    body.add(p);
    legs.push(p);
  }
  const x = -0.18, z = 0.45;
  const baseYaw = Math.atan2(-0.85 - x, -0.05 - z);
  const base = V3(x, terrainHeight(x, z) + 0.018, z);
  root.position.copy(base);
  root.rotation.y = baseYaw;
  shadows(root);
  scene.add(root);
  const st = { retreat: 0, scare: 0 };
  return {
    startle() { st.scare = 1.5; },
    update(dt, t, fishList) {
      let near = 9;
      for (const f of fishList) near = Math.min(near, f.pos.distanceTo(root.position));
      st.scare = Math.max(0, st.scare - dt);
      const want = near < 0.8 || st.scare > 0 ? 0.16 : 0;
      st.retreat = damp(st.retreat, want, want > 0 ? 3 : 0.6, dt);
      const yaw = baseYaw + Math.sin(t * 0.3) * 0.25;
      const bx = base.x - Math.sin(yaw) * st.retreat, bz = base.z - Math.cos(yaw) * st.retreat;
      root.position.set(bx, terrainHeight(bx, bz) + 0.018, bz);
      root.rotation.y = yaw;
      body.position.y = Math.sin(t * 2.1) * 0.003;
      body.rotation.x = Math.sin(t * 1.3) * 0.04;
      antennae.forEach((a, i) => { a.rotation.y = Math.sin(t * 1.7 + i * 2) * 0.18; a.rotation.x = Math.sin(t * 1.1 + i) * 0.1; });
      const busy = Math.abs(st.retreat - want) > 0.01 ? 1 : 0.35;
      legs.forEach((l, i) => { l.rotation.x = Math.sin(t * 6 + i * 0.9) * 0.25 * busy; });
    },
  };
}

function createCrab(burrow) {
  const root = new THREE.Group();
  root.name = 'crab';
  const shellMat = new THREE.MeshStandardMaterial({ color: 0xc4542e, roughness: 0.5 });
  const dark = new THREE.MeshStandardMaterial({ color: 0x1a0f0a, roughness: 0.4 });
  const body = new THREE.Mesh(new THREE.SphereGeometry(0.05, 16, 12), shellMat);
  body.scale.set(1.35, 0.55, 1.0);
  body.position.y = 0.035;
  root.add(body);
  const legs = [], claws = [];
  for (const sx of [-1, 1]) {
    const stalk = new THREE.Mesh(new THREE.CylinderGeometry(0.003, 0.003, 0.03, 5), shellMat);
    stalk.position.set(sx * 0.018, 0.06, 0.035);
    const eye = new THREE.Mesh(new THREE.SphereGeometry(0.008, 8, 6), dark);
    eye.position.set(sx * 0.018, 0.077, 0.037);
    const claw = new THREE.Group();
    claw.position.set(sx * 0.05, 0.03, 0.04);
    const pincer = new THREE.Mesh(new THREE.SphereGeometry(0.022, 10, 8), shellMat);
    pincer.scale.set(1.0, 0.75, 1.4);
    pincer.position.set(sx * 0.01, 0, 0.03);
    const finger = new THREE.Mesh(new THREE.ConeGeometry(0.008, 0.03, 6).rotateX(Math.PI / 2), dark);
    finger.position.set(sx * 0.012, 0.004, 0.064);
    claw.add(pincer, finger);
    root.add(stalk, eye, claw);
    claws.push(claw);
    for (let k = 0; k < 3; k++) {
      const p = new THREE.Group();
      p.position.set(sx * 0.055, 0.032, 0.02 - k * 0.025);
      p.rotation.z = sx * 1.0;
      p.add(new THREE.Mesh(new THREE.CylinderGeometry(0.004, 0.003, 0.07, 4).translate(0, -0.035, 0), shellMat));
      root.add(p);
      legs.push(p);
    }
  }
  const yaw = 0.35;
  root.rotation.y = yaw;
  root.visible = false;
  shadows(root);
  scene.add(root);
  const st = { phase: 'hidden', t: 0, wait: rr(5, 9), off: 0, dir: 1, y: -0.12 };
  return {
    update(dt, t) {
      st.t += dt;
      switch (st.phase) {
        case 'hidden': if (st.t > st.wait) { st.phase = 'emerge'; st.t = 0; st.dir = rand() < 0.5 ? 1 : -1; root.visible = true; } break;
        case 'emerge': st.y = lerp(-0.1, 0, easeInOut(st.t)); if (st.t > 1) { st.phase = 'walk'; st.t = 0; } break;
        case 'walk': st.off = st.dir * 0.42 * easeInOut(st.t / 2.4); if (st.t > 2.4) { st.phase = 'pause'; st.t = 0; } break;
        case 'pause': if (st.t > 1.6) { st.phase = 'back'; st.t = 0; } break;
        case 'back': st.off = st.dir * 0.42 * (1 - easeInOut(st.t / 2.4)); if (st.t > 2.4) { st.phase = 'descend'; st.t = 0; } break;
        case 'descend': st.y = lerp(0, -0.1, easeInOut(st.t / 0.9)); if (st.t > 0.9) { st.phase = 'hidden'; st.t = 0; st.wait = rr(10, 20); root.visible = false; } break;
      }
      const walking = st.phase === 'walk' || st.phase === 'back';
      const x = burrow.x + Math.cos(yaw) * st.off, z = burrow.z - Math.sin(yaw) * st.off;
      root.position.set(x, terrainHeight(x, z) + st.y, z);
      legs.forEach((l, i) => { l.rotation.x = walking ? Math.sin(t * 16 + i * 1.3) * 0.45 : 0; });
      claws.forEach((c, i) => { c.rotation.x = Math.sin(t * 2 + i) * 0.15; });
    },
  };
}

function createCreatures(details) {
  const snail = createSnail(), shrimp = createShrimp(), crab = createCrab(details.burrow);
  const eyes = details.helmetEyes;
  let blinkIn = rr(2, 5), blink = 0;
  return {
    startle(p) { shrimp.startle(p); },
    update(dt, t) {
      snail.update(dt, t);
      shrimp.update(dt, t, fishes);
      crab.update(dt, t);
      blinkIn -= dt;
      if (blinkIn < 0) { blink = 0.16; blinkIn = rr(3, 8); }
      blink -= dt;
      eyes.scale.y = blink > 0 ? 0.1 : 1;
      eyes.position.x = Math.sin(t * 0.5) * 0.008;   // glancing around
    },
  };
}

/* ============================================================================
   15. Suspended particles, plankton and microbubbles (one Points draw call)
   ========================================================================== */
function createParticles() {
  const nDust = 620, nPlank = 48, nMicro = 70, N = nDust + nPlank + nMicro;
  const pos = new Float32Array(N * 3), seed = new Float32Array(N * 4);
  for (let i = 0; i < N; i++) {
    const type = i < nDust ? 0 : i < nDust + nPlank ? 1 : 2;
    pos[i * 3] = rr(-INNER_X + 0.1, INNER_X - 0.1);
    pos[i * 3 + 1] = rr(-1.7, WATER_Y - 0.1);
    pos[i * 3 + 2] = rr(-INNER_Z + 0.22, INNER_Z - 0.22);
    seed[i * 4] = rand() * TAU;
    seed[i * 4 + 1] = rr(0.5, 1.5);
    seed[i * 4 + 2] = type === 0 ? rr(1.6, 3.2) : type === 1 ? rr(3.0, 5.0) : rr(2.2, 3.6);
    seed[i * 4 + 3] = type;
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geo.setAttribute('aSeed', new THREE.BufferAttribute(seed, 4));
  const mat = new THREE.ShaderMaterial({
    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
    uniforms: { uTime: U.uTime, uPixelRatio: U.uPixelRatio, uNight: U.uNight, uWaterY: { value: WATER_Y }, uFloorY: { value: -1.9 }, uHalfX: { value: INNER_X - 0.06 } },
    vertexShader: /* glsl */`
      uniform float uTime; uniform float uPixelRatio; uniform float uNight; uniform float uWaterY; uniform float uFloorY; uniform float uHalfX;
      attribute vec4 aSeed;
      varying float vAlpha; varying vec3 vColor; varying float vType;
      void main() {
        vec3 p = position;
        float ph = aSeed.x, sp = aSeed.y, type = aSeed.w, t = uTime;
        p.x += sin( t * 0.07 * sp + ph ) * 0.25 + t * 0.012 * sp;
        p.z += cos( t * 0.05 * sp + ph * 1.3 ) * 0.18;
        p.y += sin( t * 0.11 * sp + ph * 2.1 ) * 0.1;
        if ( type > 1.5 ) p.y = uFloorY + mod( p.y - uFloorY + t * 0.05 * sp, uWaterY - uFloorY );
        p.x = mod( p.x + uHalfX, 2.0 * uHalfX ) - uHalfX;
        p.y = min( p.y, uWaterY - 0.04 );
        vec4 mv = modelViewMatrix * vec4( p, 1.0 );
        gl_Position = projectionMatrix * mv;
        gl_PointSize = aSeed.z * uPixelRatio * ( 12.0 / -mv.z );
        float glow = type > 0.5 && type < 1.5 ? pow( max( 0.0, sin( t * 0.33 * sp + ph * 7.0 ) ), 28.0 ) : 0.0;
        vAlpha = type < 0.5 ? 0.18 : ( type < 1.5 ? 0.06 + 0.08 * uNight + glow * ( 0.5 + 0.7 * uNight ) : 0.3 );
        vColor = type < 0.5 ? vec3( 0.75, 0.85, 0.82 ) : ( type < 1.5 ? mix( vec3( 0.35, 1.0, 0.8 ), vec3( 0.45, 0.8, 1.0 ), fract( ph ) ) : vec3( 0.85, 0.96, 1.0 ) );
        vType = type;
      }`,
    fragmentShader: /* glsl */`
      varying float vAlpha; varying vec3 vColor; varying float vType;
      void main() {
        float d = length( gl_PointCoord - 0.5 );
        float a = 1.0 - smoothstep( 0.18, 0.5, d );
        if ( vType > 1.5 ) a = ( 1.0 - smoothstep( 0.38, 0.5, d ) ) * ( 0.35 + 0.65 * smoothstep( 0.12, 0.38, d ) );
        gl_FragColor = vec4( vColor, a * vAlpha );
        #include <colorspace_fragment>
      }`,
  });
  const points = new THREE.Points(geo, mat);
  points.frustumCulled = false;
  points.renderOrder = 7;
  scene.add(points);
  return points;
}

/* ============================================================================
   16. Interface, day/night, animation loop, resize, adaptive quality
   ========================================================================== */
const sim = { paused: false, night: 0, nightTarget: 0, time: 0, quality: 0, elapsed: 0, frameAcc: 0, frameN: 0 };
const WATER_DAY = col('#3aa6c4'), WATER_NIGHT = col('#123a66'), SURF_DAY = col('#7fd8f0'), SURF_NIGHT = col('#2a5a8a');

function feedRandom() {
  const f = pick(fishes);
  food.drop(clamp(f.pos.x + rr(-0.6, 0.6), -2.6, 2.6), clamp(f.pos.z + rr(-0.4, 0.4), -1.0, 1.1));
}
function setUI(show) {
  document.getElementById('panel').classList.toggle('hidden', !show);
  document.getElementById('showUI').classList.toggle('visible', !show);
  if (!show) document.getElementById('hint').classList.add('hide');
}
function toggleNight() {
  sim.nightTarget = sim.nightTarget > 0.5 ? 0 : 1;
  const b = document.getElementById('btnDay');
  b.textContent = sim.nightTarget ? '☀ Day' : '☾ Night';
  b.setAttribute('aria-pressed', String(!!sim.nightTarget));
}
function togglePause() {
  sim.paused = !sim.paused;
  const b = document.getElementById('btnPause');
  b.textContent = sim.paused ? 'Resume' : 'Pause';
  b.setAttribute('aria-pressed', String(sim.paused));
}
function initUI() {
  const $ = (id) => document.getElementById(id);
  $('btnFeed').addEventListener('click', feedRandom);
  $('btnDay').addEventListener('click', toggleNight);
  $('btnPause').addEventListener('click', togglePause);
  $('btnCam').addEventListener('click', resetCamera);
  $('btnHide').addEventListener('click', () => setUI(false));
  $('showUI').addEventListener('click', () => setUI(true));
  window.addEventListener('keydown', (e) => {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    const k = e.key.toLowerCase();
    if (k === 'h') setUI($('panel').classList.contains('hidden'));
    else if (k === 'f') feedRandom();
    else if (k === 'n') toggleNight();
    else if (k === 'p') togglePause();
  });
  setTimeout(() => $('hint').classList.add('hide'), 7000);
}

function applyDayNight(n) {
  U.uNight.value = n;
  lights.lampWarm.intensity = lerp(58, 16, n);
  lights.lampCool.intensity = lerp(20, 13, n);
  lights.ambient.intensity = lerp(0.35, 0.1, n);
  lights.hemi.intensity = lerp(0.5, 0.14, n);
  lights.key.intensity = lerp(1.3, 0.22, n);
  lights.cyan.intensity = lerp(9, 5, n);
  lights.violet.intensity = lerp(1.8, 3.2, n);
  U.uCaustic.value = lerp(0.62, 0.24, n);
  renderer.toneMappingExposure = lerp(1.1, 0.98, n);
  water.volMat.color.copy(WATER_DAY).lerp(WATER_NIGHT, n);
  water.volMat.opacity = lerp(0.12, 0.19, n);
  water.surfMat.color.copy(SURF_DAY).lerp(SURF_NIGHT, n);
  tank.warmStripMat.color.setRGB(lerp(1.7, 0.55, n), lerp(1.48, 0.48, n), lerp(1.15, 0.45, n));
  anemone.setGlow(lerp(0.1, 0.9, n));
}

function onResize() {
  const w = window.innerWidth, h = window.innerHeight;
  camera.aspect = w / h;
  camera.fov = clamp(32 / Math.min(1, camera.aspect * 1.05), 32, 60);   // keep the tank framed on portrait screens
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
  U.uPixelRatio.value = renderer.getPixelRatio();
}

/** Fallback for slow GPUs: drop glass transmission first, then render resolution. */
function adaptQuality(raw) {
  if (PARAMS.has('noadapt') || sim.quality >= 2 || document.hidden) return;
  sim.elapsed += raw;
  if (sim.elapsed < 3) return;
  sim.frameAcc += raw;
  sim.frameN++;
  if (sim.frameAcc < 2.5) return;
  const avg = sim.frameAcc / sim.frameN;
  sim.frameAcc = 0; sim.frameN = 0;
  if (avg <= 1 / 38) return;
  sim.quality++;
  if (sim.quality === 1) { tank.glassMat.transmission = 0; tank.glassMat.opacity = 0.08; }
  else { renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1)); onResize(); }
}

function simulate(dt) {
  sim.time += dt;
  U.uTime.value = sim.time;
  water.update(sim.time, dt);
  for (const f of fishes) f.update(dt, sim.time, WORLD);
  anemone.update(dt, fishes);
  chest.update(dt);
  bubbles.update(dt);
  food.update(dt, sim.time);
  creatures.update(dt, sim.time);
  duck.update(dt);
}

function animate() {
  requestAnimationFrame(animate);
  const raw = Math.min(clock.getDelta(), 0.1);
  const dt = sim.paused ? 0 : raw;
  sim.night = damp(sim.night, sim.nightTarget, 1.1, raw);
  applyDayNight(sim.night);
  if (dt > 0) simulate(dt);
  ripples.update(raw);
  updateCamera(raw);
  renderer.render(scene, camera);
  adaptQuality(raw);
}

function start() {
  const t0 = performance.now();
  initRenderer();
  initCamera();
  lights = createLights();
  tank = createTank();
  water = createWater();
  createTerrain();
  createGravel();
  createRocks();
  createDriftwood();
  createRuins();
  chest = createChest();
  createBottle();
  const details = createDetails();
  duck = createDuck();
  createPlants();
  createCoral();
  anemone = createAnemone();
  buildMoss();
  bubbles = new BubbleSystem();
  food = new FoodSystem();
  ripples = new RippleRings();
  particles = createParticles();
  creatures = createCreatures(details);
  FISH_BODY_GEO = buildFishBodyGeometry();
  for (const cfg of FISH_CONFIGS) {
    const f = new Clownfish(cfg);
    fishes.push(f);
    scene.add(f.group);
  }
  Object.assign(WORLD, { fishes, food, anemone });
  initInteraction();
  initUI();
  window.addEventListener('resize', onResize);
  onResize();
  // ?debug exposes internals for inspection from the console; it changes nothing else.
  if (PARAMS.has('debug')) window.__aquarium = { THREE, scene, camera, controls, renderer, fishes, food, chest, anemone, duck, sim, OBSTACLES, POIS, SWIM, terrainHeight, simulate, applyDayNight, buildMs: performance.now() - t0 };
  animate();
}

const webglOK = (() => {
  try { const c = document.createElement('canvas'); return !!(window.WebGLRenderingContext && (c.getContext('webgl2') || c.getContext('webgl'))); }
  catch (e) { return false; }
})();
if (webglOK) start();
else document.getElementById('fallback').hidden = false;
</script>
