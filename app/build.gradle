plugins {
    id 'com.android.application'
}

android {
    namespace 'com.eclipsbox.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.eclipsbox.app"
        minSdk 24
        targetSdk 28
        versionCode 1
        versionName "1.0"

        ndk {
            // BlackBox core ships arm64 native hooks only
            abiFilters "arm64-v8a"
        }
    }

    buildTypes {
        debug {
            // debug builds use the auto-generated debug keystore
            applicationIdSuffix ""
            minifyEnabled false
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildFeatures {
        viewBinding true
    }

    // BlackBox needs the .so files extracted on disk so the native hooks can dlopen them
    packagingOptions {
        jniLibs {
            useLegacyPackaging = true
        }
    }

    lintOptions {
        checkReleaseBuilds false
        abortOnError false
    }
}

dependencies {
    implementation project(':Bcore')

    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.9.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.core:core:1.9.0'
}
